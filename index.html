<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT P2S Abu Zairi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            /* Prevent pull-to-refresh on mobile */
            overscroll-behavior-y: contain; 
        }
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Main App Container -->
    <div id="app" class="w-full h-full flex flex-col overflow-y-auto">
        <!-- Rendered Content Will Go Here -->
    </div>

<!-- Tambahkan Library Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ==========================================
    // KONFIGURASI SUPABASE & APPS SCRIPT
    // ==========================================
    // 1. Supabase Config (Ganti dengan milik Anda)
    // PERBAIKAN 1: Hapus "/rest/v1/" di akhir URL agar fungsi auth berjalan normal
    const SUPABASE_URL = 'https://rmokqxewlajmgnkbhxab.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtb2txeGV3bGFqbWdua2JoeGFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDk2MDEsImV4cCI6MjA5NDA4NTYwMX0.e3Xyc79055zVaO5pXYcyna_ksICED_NDZqHO_D4tJXE';
    
    // PERBAIKAN 2: Ubah nama variabel "supabase" menjadi "supabaseClient" untuk menghindari bentrok dengan library CDN
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Apps Script Config (Ganti dengan URL Web App Apps Script Anda)
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw0PUgwdvYFibsOea94_3w8Jod-XtxWxXsX8LxvK7hMYWtdA5q9npBgY0lOhwfGSn5dcw/exec';

    /* ==========================================
       STATE MANAGEMENT & MOCK DATA
       ========================================== */
    // Note: In production, replace mock data with Supabase calls.
    const state = {
        view: 'login', // login, token-entry, cbt-exam, cbt-result, guru-dashboard, admin-dashboard
        role: null, // 'siswa', 'guru', or 'admin'
        user: null,
        examToken: 'ABUZAIRI2026',
        cbt: {
            questions: [
                { id: 1, type: 'pg', text: 'Siapakah presiden pertama Indonesia?', options: ['Soekarno', 'Suharto', 'Habibie', 'Jokowi'], answer: null },
                { id: 2, type: 'pg', text: 'Berapakah hasil dari 5 x 5?', options: ['10', '20', '25', '30'], answer: null },
                { id: 3, type: 'pg', text: 'Ibukota provinsi Jawa Timur adalah...', options: ['Surabaya', 'Malang', 'Semarang', 'Bandung'], answer: null },
                { id: 4, type: 'essay', text: 'Jelaskan secara singkat makna dari Pancasila sila ke-3!', answer: null }
            ],
            currentIndex: 0,
            timeLeft: 120, // 2 minutes for demo
            timerInterval: null
        }
    };

    /* ==========================================
       UTILITIES
       ========================================== */
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const bgColor = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-green-500' : 'bg-blue-500');
        
        toast.className = `${bgColor} text-white px-4 py-3 rounded shadow-lg flex items-center gap-3 toast-enter max-w-sm`;
        toast.innerHTML = `
            <i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
            <span class="text-sm font-medium">${message}</span>
        `;
        
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100%)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function render() {
        const app = document.getElementById('app');
        app.innerHTML = '';
        
        switch (state.view) {
            case 'login': app.innerHTML = getLoginHTML(); break;
            case 'token-entry': app.innerHTML = getTokenEntryHTML(); break;
            case 'cbt-exam': app.innerHTML = getCBTExamHTML(); attachCBTListeners(); break;
            case 'cbt-result': app.innerHTML = getCBTResultHTML(); break;
            case 'guru-dashboard': app.innerHTML = getGuruDashboardHTML(); break;
            case 'admin-dashboard': app.innerHTML = getAdminDashboardHTML(); break;
        }
    }

    /* ==========================================
       VIEWS / HTML GENERATORS
       ========================================== */

    // 1. LOGIN VIEW
    function getLoginHTML() {
        return `
            <div class="flex-1 flex items-center justify-center bg-slate-100 p-4">
                <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                    <div class="bg-blue-600 p-6 text-center text-white">
                        <i class="fas fa-graduation-cap text-4xl mb-2"></i>
                        <h1 class="text-2xl font-bold">CBT P2S Abu Zairi</h1>
                        <p class="text-blue-100 text-sm mt-1">Sistem Ujian Berbasis Komputer</p>
                    </div>
                    <div class="p-6 md:p-8">
                        <div class="flex gap-2 mb-6 bg-slate-100 p-1 rounded-lg">
                            <button onclick="switchLoginRole('siswa')" id="btn-role-siswa" class="flex-1 py-2 rounded-md font-medium bg-white shadow text-blue-600 transition">Siswa</button>
                            <button onclick="switchLoginRole('guru')" id="btn-role-guru" class="flex-1 py-2 rounded-md font-medium text-slate-500 hover:text-slate-800 transition">Guru</button>
                            <button onclick="switchLoginRole('admin')" id="btn-role-admin" class="flex-1 py-2 rounded-md font-medium text-slate-500 hover:text-slate-800 transition">Admin</button>
                        </div>
                        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Username / NIS</label>
                                <input type="text" id="username" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Masukkan username atau NIS">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Masukkan password">
                            </div>
                            <button type="submit" id="btn-login-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition mt-4 flex justify-center items-center gap-2">
                                Masuk Aplikasi
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        `;
    }

    let currentLoginRole = 'siswa';
    function switchLoginRole(role) {
        currentLoginRole = role;
        const roles = ['siswa', 'guru', 'admin'];
        roles.forEach(r => {
            const btn = document.getElementById(`btn-role-${r}`);
            if (r === role) {
                btn.className = 'flex-1 py-2 rounded-md font-medium bg-white shadow text-blue-600 transition';
            } else {
                btn.className = 'flex-1 py-2 rounded-md font-medium text-slate-500 hover:text-slate-800 transition';
            }
        });
    }

    async function handleLogin(e) {
        e.preventDefault();
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value;
        const btnSubmit = document.getElementById('btn-login-submit');

        // Ubah tampilan tombol saat loading
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memeriksa...';

        try {
            // Trik merubah Username/NIS menjadi format Email yang diminta Supabase Auth
            let emailLogin = usernameInput;
            if (!emailLogin.includes('@')) {
                emailLogin = emailLogin + '@cbt.com'; 
            }

            // PROSES AUTH KE SUPABASE (PERBAIKAN 3: Memanggil supabaseClient)
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailLogin,
                password: passwordInput,
            });

            if (error) {
                throw error;
            }

            // LOGIN BERHASIL
            state.role = currentLoginRole;
            // Ambil nama dari email (contoh: 'admin@cbt.com' jadi 'admin')
            state.user = { name: usernameInput.split('@')[0], authData: data.user };
            
            if (state.role === 'siswa') {
                state.view = 'token-entry';
            } else if (state.role === 'guru') {
                state.view = 'guru-dashboard';
            } else {
                state.view = 'admin-dashboard';
            }
            
            render();
            showToast(`Login berhasil! Selamat datang.`, 'success');

        } catch (error) {
            // LOGIN GAGAL (Password salah / User tidak ditemukan)
            let pesanError = "Terjadi kesalahan saat login.";
            if (error.message.includes("Invalid login credentials")) {
                pesanError = "Username/NIS atau Password salah!";
            } else if (error.message.includes("Email not confirmed")) {
                pesanError = "Akun belum diverifikasi.";
            }
            showToast(pesanError, 'error');
            
            // Kembalikan tombol seperti semula
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = 'Masuk Aplikasi';
        }
    }

    // 2. SISWA TOKEN ENTRY VIEW
    function getTokenEntryHTML() {
        return `
            <div class="flex flex-col h-full bg-slate-50">
                <header class="bg-white border-b px-4 py-3 flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-graduation-cap text-blue-600 text-xl"></i>
                        <span class="font-bold text-slate-800">CBT P2S</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-medium text-slate-600"><i class="fas fa-user-circle mr-1"></i> ${state.user.name}</span>
                        <button onclick="logout()" class="text-red-500 hover:text-red-700 text-sm"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </header>
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="bg-white rounded-xl shadow-md p-6 max-w-sm w-full text-center">
                        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                            <i class="fas fa-key"></i>
                        </div>
                        <h2 class="text-xl font-bold mb-2">Token Ujian</h2>
                        <p class="text-sm text-slate-500 mb-6">Silakan masukkan token ujian yang diberikan oleh pengawas.</p>
                        <form onsubmit="handleToken(event)">
                            <input type="text" id="token-input" required class="w-full text-center tracking-widest uppercase font-bold text-lg px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none mb-4" placeholder="XXXXXX">
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">
                                Mulai Kerjakan
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        `;
    }

    function handleToken(e) {
        e.preventDefault();
        const token = document.getElementById('token-input').value.toUpperCase();
        if (token === state.examToken) {
            state.view = 'cbt-exam';
            startTimer();
            render();
            showToast('Token valid. Ujian dimulai!', 'success');
        } else {
            showToast('Token tidak valid! (Hint: ABUZAIRI2026)', 'error');
        }
    }

    // 3. CBT EXAM INTERFACE
    function getCBTExamHTML() {
        const q = state.cbt.questions[state.cbt.currentIndex];
        const isLast = state.cbt.currentIndex === state.cbt.questions.length - 1;
        const isFirst = state.cbt.currentIndex === 0;

        let questionContent = '';
        if (q.type === 'pg') {
            questionContent = `
                <div class="space-y-3 mt-4">
                    ${q.options.map((opt, idx) => {
                        const isChecked = q.answer === opt ? 'checked' : '';
                        const bgClass = q.answer === opt ? 'bg-blue-50 border-blue-500' : 'bg-white border-slate-200 hover:bg-slate-50';
                        return `
                        <label class="flex items-center p-3 border rounded-lg cursor-pointer transition ${bgClass}">
                            <input type="radio" name="pg-answer" value="${opt}" class="w-4 h-4 text-blue-600 focus:ring-blue-500" ${isChecked} onchange="saveAnswer('${opt}')">
                            <span class="ml-3 text-slate-700 font-medium">${String.fromCharCode(65 + idx)}. ${opt}</span>
                        </label>
                        `;
                    }).join('')}
                </div>
            `;
        } else if (q.type === 'essay') {
            questionContent = `
                <div class="mt-4">
                    <textarea id="essay-answer" rows="5" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ketik jawaban Anda di sini..." onblur="saveAnswer(this.value)">${q.answer || ''}</textarea>
                    <p class="text-xs text-slate-400 mt-2"><i class="fas fa-save"></i> Jawaban tersimpan otomatis saat Anda pindah soal.</p>
                </div>
            `;
        }

        return `
            <div class="flex flex-col h-full bg-slate-50">
                <!-- Header -->
                <header class="bg-white border-b px-4 py-3 flex justify-between items-center shadow-sm sticky top-0 z-20">
                    <div>
                        <h1 class="font-bold text-slate-800 text-sm md:text-base truncate max-w-[150px] md:max-w-xs">Matematika & Umum</h1>
                        <p class="text-xs text-slate-500">${state.user.name}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="bg-slate-800 text-white px-3 py-1.5 rounded-lg flex items-center gap-2 font-mono text-sm shadow-inner">
                            <i class="far fa-clock"></i>
                            <span id="timer-display">${formatTime(state.cbt.timeLeft)}</span>
                        </div>
                        <button onclick="toggleGrid()" class="md:hidden bg-slate-200 p-2 rounded-lg text-slate-600">
                            <i class="fas fa-th"></i>
                        </button>
                    </div>
                </header>

                <div class="flex flex-1 overflow-hidden">
                    <!-- Main Question Area -->
                    <main class="flex-1 overflow-y-auto p-4 md:p-6 hide-scroll relative pb-24">
                        <div class="max-w-3xl mx-auto bg-white p-5 md:p-8 rounded-xl shadow-sm border border-slate-100">
                            <div class="flex justify-between items-center mb-4 border-b pb-3">
                                <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">
                                    Soal No. ${state.cbt.currentIndex + 1}
                                </span>
                                <span class="text-xs text-slate-400 font-medium">${q.type === 'pg' ? 'Pilihan Ganda' : 'Essay'}</span>
                            </div>
                            <div class="text-base md:text-lg text-slate-800 leading-relaxed font-medium">
                                ${q.text}
                            </div>
                            ${questionContent}
                        </div>
                    </main>

                    <!-- Sidebar Grid -->
                    <aside id="question-grid" class="hidden md:block w-64 bg-white border-l shadow-sm overflow-y-auto fixed md:relative right-0 top-0 h-full z-30 transition-transform transform translate-x-full md:translate-x-0">
                        <div class="p-4 flex flex-col h-full">
                            <div class="flex justify-between items-center mb-4 md:hidden">
                                <h3 class="font-bold">Navigasi Soal</h3>
                                <button onclick="toggleGrid()" class="text-slate-500"><i class="fas fa-times text-xl"></i></button>
                            </div>
                            <h3 class="font-bold text-slate-700 hidden md:block mb-3 border-b pb-2">Navigasi Soal</h3>
                            <div class="grid grid-cols-4 gap-2 mb-6">
                                ${state.cbt.questions.map((item, idx) => {
                                    let btnClass = 'bg-white border-slate-300 text-slate-600 hover:bg-slate-100'; // default
                                    if (item.answer !== null && item.answer !== '') {
                                        btnClass = 'bg-green-500 border-green-600 text-white shadow-sm'; // answered
                                    }
                                    if (idx === state.cbt.currentIndex) {
                                        btnClass = 'bg-blue-600 border-blue-700 text-white ring-2 ring-blue-300'; // active
                                    }
                                    return `<button onclick="jumpToQuestion(${idx})" class="w-full aspect-square flex items-center justify-center rounded border font-medium text-sm transition ${btnClass}">${idx + 1}</button>`;
                                }).join('')}
                            </div>
                            
                            <div class="mt-auto pt-4 border-t">
                                <div class="flex items-center gap-2 text-xs mb-1"><span class="w-3 h-3 bg-green-500 rounded-sm"></span> Sudah Dijawab</div>
                                <div class="flex items-center gap-2 text-xs"><span class="w-3 h-3 border border-slate-300 rounded-sm"></span> Belum Dijawab</div>
                            </div>
                        </div>
                    </aside>
                </div>

                <!-- Footer Navigation -->
                <footer class="bg-white border-t p-3 md:p-4 flex justify-between items-center fixed bottom-0 w-full md:w-[calc(100%-16rem)] z-20">
                    <button onclick="prevQuestion()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50 font-medium transition flex items-center gap-2 ${isFirst ? 'opacity-50 cursor-not-allowed' : ''}" ${isFirst ? 'disabled' : ''}>
                        <i class="fas fa-chevron-left"></i> <span class="hidden sm:inline">Sebelumnya</span>
                    </button>
                    
                    ${isLast ? `
                        <button onclick="confirmSubmit()" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow transition flex items-center gap-2">
                            <i class="fas fa-check-circle"></i> Selesai
                        </button>
                    ` : `
                        <button onclick="nextQuestion()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow transition flex items-center gap-2">
                            <span class="hidden sm:inline">Selanjutnya</span> <i class="fas fa-chevron-right"></i>
                        </button>
                    `}
                </footer>
                
                <!-- Mobile Overlay -->
                <div id="grid-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden" onclick="toggleGrid()"></div>
            </div>
        `;
    }

    function attachCBTListeners() {
        window.onbeforeunload = function() {
            if(state.view === 'cbt-exam') return "Ujian sedang berlangsung, yakin ingin keluar?";
        };
    }

    function saveAnswer(value) {
        const q = state.cbt.questions[state.cbt.currentIndex];
        q.answer = value;
        render(); 
        showToast('Jawaban tersimpan otomatis', 'success');
    }

    function nextQuestion() {
        if (state.cbt.currentIndex < state.cbt.questions.length - 1) {
            state.cbt.currentIndex++;
            render();
        }
    }

    function prevQuestion() {
        if (state.cbt.currentIndex > 0) {
            state.cbt.currentIndex--;
            render();
        }
    }

    function jumpToQuestion(idx) {
        state.cbt.currentIndex = idx;
        render();
        const grid = document.getElementById('question-grid');
        if(!grid.classList.contains('translate-x-full')) toggleGrid();
    }

    function toggleGrid() {
        const grid = document.getElementById('question-grid');
        const overlay = document.getElementById('grid-overlay');
        
        if (grid.classList.contains('translate-x-full')) {
            grid.classList.remove('hidden');
            setTimeout(() => {
                grid.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            }, 10);
        } else {
            grid.classList.add('translate-x-full');
            overlay.classList.add('hidden');
            setTimeout(() => grid.classList.add('hidden'), 300);
        }
    }

    function startTimer() {
        clearInterval(state.cbt.timerInterval);
        state.cbt.timerInterval = setInterval(() => {
            state.cbt.timeLeft--;
            const display = document.getElementById('timer-display');
            if(display) display.innerText = formatTime(state.cbt.timeLeft);
            
            if (state.cbt.timeLeft <= 0) {
                clearInterval(state.cbt.timerInterval);
                finishExam(true); 
            }
        }, 1000);
    }

    function confirmSubmit() {
        const unanswered = state.cbt.questions.filter(q => q.answer === null || q.answer === '').length;
        let msg = "Apakah Anda yakin ingin menyelesaikan ujian?";
        if(unanswered > 0) msg = `Masih ada ${unanswered} soal yang belum dijawab. Yakin ingin mengakhiri?`;
        
        showConfirmModal(msg, () => finishExam(false));
    }

    function showConfirmModal(msg, onConfirm) {
        const modal = document.createElement('div');
        modal.className = 'fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm';
        modal.innerHTML = `
            <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center">
                <i class="fas fa-question-circle text-4xl text-blue-500 mb-4"></i>
                <p class="text-slate-800 font-medium mb-6">${msg}</p>
                <div class="flex gap-3 justify-center">
                    <button id="btn-cancel" class="px-4 py-2 rounded-lg bg-slate-200 text-slate-700 font-medium hover:bg-slate-300">Batal</button>
                    <button id="btn-ok" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700">Yakin Selesai</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.getElementById('btn-cancel').onclick = () => modal.remove();
        document.getElementById('btn-ok').onclick = () => {
            modal.remove();
            onConfirm();
        };
    }

    async function finishExam(isTimeout) {
        window.onbeforeunload = null; 
        clearInterval(state.cbt.timerInterval);
        
        showToast('Mengirim jawaban...', 'info');

        try {
            if (APPS_SCRIPT_URL !== 'GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT_ANDA') {
                let skorPG = 0;
                state.cbt.questions.forEach(q => {
                    if (q.type === 'pg' && q.answer) skorPG += 20; 
                });

                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        nis: state.user.name,
                        namaSiswa: state.user.name,
                        token: state.examToken,
                        skorPG: skorPG,
                        skorEssay: 0
                    })
                });
            } else {
                console.warn('URL Apps Script belum diisi!');
            }

            if (isTimeout) {
                showToast('Waktu habis! Jawaban otomatis dikirim.', 'info');
            } else {
                showToast('Ujian selesai. Jawaban berhasil dikirim.', 'success');
            }
            
            state.view = 'cbt-result';
            render();

        } catch (error) {
            showToast('Terjadi kesalahan saat mengirim jawaban.', 'error');

    // --- FITUR GURU: BUAT SOAL MANUAL ---
    function openBuatSoalModal() {
        const modal = document.createElement('div');
        modal.id = 'buat-soal-modal';
        modal.className = 'fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm';

                </div>
                <form onsubmit="saveSoal(event)" class="space-y-4 text-left">

                        <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Soal</label>
                        <select id="input-jenis" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" onchange="toggleOpsiJawaban()">

                        <textarea id="input-pertanyaan" required rows="3" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ketik pertanyaan di sini..."></textarea>
                    </div>
                    
                    <div id="container-opsi" class="space-y-3">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Opsi Jawaban & Kunci</label>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunci_pg" value="0" required class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="font-bold text-slate-700 w-5">A.</span>
                            <input type="text" id="opsi-a" class="flex-1 px-3 py-1.5 border border-slate-300 rounded outline-none focus:border-blue-500" placeholder="Pilihan A" required>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunci_pg" value="1" required class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="font-bold text-slate-700 w-5">B.</span>
                            <input type="text" id="opsi-b" class="flex-1 px-3 py-1.5 border border-slate-300 rounded outline-none focus:border-blue-500" placeholder="Pilihan B" required>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunci_pg" value="2" required class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="font-bold text-slate-700 w-5">C.</span>
                            <input type="text" id="opsi-c" class="flex-1 px-3 py-1.5 border border-slate-300 rounded outline-none focus:border-blue-500" placeholder="Pilihan C" required>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunci_pg" value="3" required class="w-4 h-4 text-blue-600 focus:ring-blue-500">

                        <p class="text-xs text-slate-500 mt-1"><i class="fas fa-info-circle"></i> Pilih salah satu radio button di sebelah kiri sebagai Kunci Jawaban.</p>

    function closeBuatSoalModal() {
        const modal = document.getElementById('buat-soal-modal');
        if (modal) modal.remove();
    }

    function toggleOpsiJawaban() {
        const jenis = document.getElementById('input-jenis').value;
        const containerOpsi = document.getElementById('container-opsi');
        const containerKunciEssay = document.getElementById('container-kunci-essay');
        const opsiInputs = containerOpsi.querySelectorAll('input[type="text"], input[type="radio"]');

        if (jenis === 'pg') {
            containerOpsi.classList.remove('hidden');
            containerKunciEssay.classList.add('hidden');
            opsiInputs.forEach(input => input.required = true);
        } else {
            containerOpsi.classList.add('hidden');
            containerKunciEssay.classList.remove('hidden');
            opsiInputs.forEach(input => input.required = false);
        }
    }

    async function saveSoal(e) {
        e.preventDefault();
        const btnSimpan = document.getElementById('btn-simpan-soal');
        btnSimpan.disabled = true;
        btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

        const jenis = document.getElementById('input-jenis').value;
        const pertanyaan = document.getElementById('input-pertanyaan').value;
        
        let opsi_jawaban = null;
        let kunci_jawaban = null;

        if (jenis === 'pg') {
            const opsiA = document.getElementById('opsi-a').value;
            const opsiB = document.getElementById('opsi-b').value;
            const opsiC = document.getElementById('opsi-c').value;
            const opsiD = document.getElementById('opsi-d').value;
            opsi_jawaban = [opsiA, opsiB, opsiC, opsiD];
            
            // Ambil opsi mana yang ditandai sebagai kunci (0, 1, 2, 3)
            const selectedRadio = document.querySelector('input[name="kunci_pg"]:checked');
            if (selectedRadio) {
                const indexKunci = parseInt(selectedRadio.value);
                kunci_jawaban = opsi_jawaban[indexKunci]; // Simpan teks jawaban aslinya
            }
        } else {
            kunci_jawaban = document.getElementById('input-kunci-essay').value;
        }

        try {
            // Menyimpan ke database Supabase tabel 'soal'
            const { data, error } = await supabaseClient
                .from('soal')
                .insert([
                    { 
                        jenis: jenis, 
                        pertanyaan: pertanyaan, 
                        opsi_jawaban: opsi_jawaban, 
                        kunci_jawaban: kunci_jawaban 
                    }
                ])
                .select();

            if (error) throw error;

            showToast('Soal berhasil disimpan ke Database!', 'success');
            closeBuatSoalModal();

        } catch (error) {
            console.error('Error saving soal:', error);
            showToast('Gagal menyimpan: ' + error.message, 'error');
        } finally {
            if(document.getElementById('btn-simpan-soal')) {
                btnSimpan.disabled = false;
                btnSimpan.innerHTML = '<i class="fas fa-save"></i> Simpan Soal';
            }
        }
    }
    // --- AKHIR FITUR GURU ---

    async function logout() {
        // PERBAIKAN 4: Memanggil supabaseClient untuk fitur keluar
        await supabaseClient.auth.signOut();
        
        state.view = 'login';
        state.user = null;
        state.role = null;
        clearInterval(state.cbt.timerInterval);
        render();
        showToast('Anda telah berhasil keluar.', 'info');
    }

    window.onload = render;

</script>
