async function saveMasterDataToDB(k,d){
const cleanData=JSON.parse(JSON.stringify(d??null));
const payload={kategori:k,list_data:cleanData};
try{
let res=await db.from('master_data').update({list_data:cleanData}).eq('kategori',k).select('kategori');
if(res.error)throw res.error;
if(!res.data||res.data.length===0){
res=await db.from('master_data').insert([payload]).select('kategori');
if(res.error)throw res.error;
}
try{localStorage.setItem(`backup_master_${k}`,JSON.stringify(cleanData));}catch(_e){}
return true;
}catch(e){
try{localStorage.setItem(`backup_master_${k}`,JSON.stringify(cleanData));}catch(_e){}
const msg=(e&&e.message)?e.message:String(e);
const detail=msg.includes('Failed to fetch')?'Koneksi/akses Supabase gagal. Data dicadangkan di browser, tetapi belum masuk database. Cek internet, publish melalui hosting/localhost, dan policy INSERT/UPDATE master_data.':msg;
showToast('Gagal simpan ke DB: '+detail,'error');
throw e;
}
}

function mergePembuatSoalActivity(list,entry){

const idx=arr.findIndex(x=>String(x.niy||'')===String(entry.niy||'')&&String(x.mapel||'')===String(entry.mapel||'')&&String(x.kelas||'')===String(entry.kelas||''));

if(idx>=0){
const old=arr[idx]||{};
arr[idx]={...old,nama:entry.nama||old.nama,auth_id:entry.auth_id||old.auth_id,mapel:entry.mapel,kelas:entry.kelas,total_dibuat:(Number(old.total_dibuat)||0)+(Number(entry.total_dibuat)||0),pg:(Number(old.pg)||0)+(Number(entry.pg)||0),essay:(Number(old.essay)||0)+(Number(entry.essay)||0),total_import:(Number(old.total_import)||0)+(Number(entry.total_import)||0),total_edit:(Number(old.total_edit)||0)+(Number(entry.total_edit)||0),last_action:entry.last_action||old.last_action,last_at:now};
}else{
arr.push({...entry,total_dibuat:Number(entry.total_dibuat)||0,pg:Number(entry.pg)||0,essay:Number(entry.essay)||0,total_import:Number(entry.total_import)||0,total_edit:Number(entry.total_edit)||0,last_at:now});

await loadPembuatSoalActivityFromDB();

}

function getSoalMediaUrl(row){
if(!row)return'';
return String(row.gambar_url||row.gambar||row.media_url||row.url_media||'').trim();
}
function normalizeOpsiJawaban(value){
if(Array.isArray(value))return value.map(v=>String(v??''));
if(value===undefined||value===null||value==='')return [];
if(typeof value==='string'){
try{const parsed=JSON.parse(value);if(Array.isArray(parsed))return parsed.map(v=>String(v??''));}catch(_e){}
return value.split('|').map(v=>v.trim()).filter(Boolean);
}
return [];
}
function normalizeSoalRecord(q){

r.jenis=String(r.jenis||'pg').toLowerCase().includes('essay')?'essay':'pg';
r.opsi_jawaban=r.jenis==='pg'?normalizeOpsiJawaban(r.opsi_jawaban):null;
r.gambar_url=getSoalMediaUrl(r)||null;
r.bobot=Number(r.bobot)||(r.jenis==='pg'?state.guruSetup.bobotPG:state.guruSetup.bobotEssay)||0;
r.pertanyaan=String(r.pertanyaan||'');
r.kunci_jawaban=String(r.kunci_jawaban||'');
return r;
}
function getDbErrorMessage(error){
const raw=String(error?.message||error?.details||error?.hint||error||'Unknown error');
if(raw.includes('Failed to fetch'))return 'Koneksi ke Supabase gagal. Coba buka dari hosting/localhost dan cek internet.';
if(raw.toLowerCase().includes('row-level security'))return 'Akses simpan tabel soal ditolak oleh RLS Supabase. Aktifkan policy INSERT/UPDATE untuk akun guru/authenticated.';
if(raw.includes('schema cache')||raw.includes('Could not find'))return raw+' — kemungkinan struktur kolom tabel soal belum sama dengan file HTML.';
return raw;
}
function getUnknownColumnName(error){
const msg=String(error?.message||error?.details||error||'');
let m=msg.match(/Could not find the '([^']+)' column/i)||msg.match(/column "([^"]+)"/i)||msg.match(/column ([a-zA-Z0-9_]+) does not exist/i);
return m?m[1]:'';
}
function cloneClean(value){return JSON.parse(JSON.stringify(value??null));}
function remapMediaColumn(payload,columnName){
const rows=Array.isArray(payload)?payload.map(x=>({...x})):[{...payload}];
rows.forEach(row=>{
const media=row.gambar_url??row.gambar??row.media_url??row.url_media;
['gambar_url','gambar','media_url','url_media'].forEach(k=>delete row[k]);
if(media!==undefined&&media!==null&&String(media).trim()!=='')row[columnName]=String(media).trim();
});
return Array.isArray(payload)?rows:rows[0];
}
async function writeSoalToDB(mode,payload,id=null){
let attemptPayload=cloneClean(payload);
let triedMediaFallback=false;
for(let attempt=0;attempt<5;attempt++){
const res=mode==='update'
?await db.from('soal').update(attemptPayload).eq('id',id)
:await db.from('soal').insert(attemptPayload);
if(!res.error)return res;
const missing=getUnknownColumnName(res.error);
if(missing){
if(missing==='gambar_url'&&!triedMediaFallback){attemptPayload=remapMediaColumn(attemptPayload,'gambar');triedMediaFallback=true;continue;}
const rows=Array.isArray(attemptPayload)?attemptPayload:[attemptPayload];
rows.forEach(row=>delete row[missing]);
attemptPayload=Array.isArray(attemptPayload)?rows:rows[0];
continue;
}
throw res.error;
}
throw new Error('Gagal menyesuaikan payload tabel soal. Cek kolom tabel soal di Supabase.');
}

function togglePasswordVisibility(){const p=$id('password'),i=$id('toggle-password-icon');if(p.type==='password'){p.type='text';i.classList.replace('fa-eye','fa-eye-slash');}else{p.type='password';i.classList.replace('fa-eye-slash','fa-eye');}}

async function handleLogin(e){
e.preventDefault();const u=$id('username').value.trim(),p=$id('password').value,btn=$id('btn-login-submit'),base=u.split('@')[0].trim();btn.disabled=true;btn.innerHTML='<i class="fas fa-circle-notch fa-spin"></i> Memeriksa...';
try{
let authData=null,detectedRole=null;const roles=['siswa','guru','admin'];
for(const role of roles){const{data,error}=await db.auth.signInWithPassword({email:`${base}@${role}.cbt.com`,password:p});if(!error&&data.user){authData=data;detectedRole=role;break;}}
if(!authData)throw new Error("Invalid login");
state.role=detectedRole;state.user={name:base,authData:authData.user};
await Promise.all([loadMasterDataFromDB(),loadDataSiswaFromDB(),loadDataGuruFromDB(),loadHasilUjianFromDB()]);
if(state.role==='siswa'){const s=state.adminSetup.dataSiswa.find(x=>x.nis===base);state.user.realName=s?(s.nama_lengkap||s.nama||base):base;state.user.kelas=s?s.kelas:'7A';state.view='student-dashboard';}
else if(state.role==='guru'){const g=state.adminSetup.dataGuru.find(x=>x.niy===base);state.user.realName=g?(g.nama||base):base;await loadDaftarSoal();state.view='guru-dashboard';}
else{state.user.realName='Administrator';await loadDaftarSoal();state.view='admin-dashboard';}
render();showToast(`Login berhasil! Selamat datang.`,'success');
}catch(error){showToast("Username atau Password salah!",'error');btn.disabled=false;btn.innerHTML='Masuk <i class="fas fa-arrow-right text-sm ml-1 opacity-80"></i>';}
}

}else if(nw>eD){

}else{
if(!isTodayDate(j.tanggal))return;
let sb='',ab='',bdg='bg-blue-50 dark:bg-blue-900/20 text-blue-600';

function initStudentDashTimers(){clearInterval(studentTimerInterval);studentTimerInterval=setInterval(()=>{const s=document.querySelectorAll('[id^="cd-"]');let nR=false;s.forEach(sp=>{const t=parseInt(sp.getAttribute('data-time')),nw=new Date().getTime(),df=t-nw;if(df<=0)nR=true;else{const h=Math.floor((df%(1000*60*60*24))/(1000*60*60)),m=Math.floor((df%(1000*60*60))/(1000*60)),sc=Math.floor((df%(1000*60))/1000);sp.innerText=`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sc.toString().padStart(2,'0')}`;}});if(nR)render();},1000);}

function openExamConfirmation(m){state.cbt.activeMapel=m;state.view='exam-confirmation';render();}
function getExamConfirmationHTML(){
const m=state.cbt.activeMapel,cL=state.user.kelas||'7A';
const j=findTodayJadwal(m,cL)||{durasi:60};const hs=state.hasilUjian.find(h=>h.mapel===m&&h.nis===state.user.name);const cfg=state.pengaturanUjian.find(p=>p.mapel===m&&p.kelas===cL)||{acakSoal:true};
const acakTeks=cfg.acakSoal!==false?'Aktif':'Tidak';let titleStatus="",btnText="Mulai Kerjakan Ujian";
if(hs&&hs.status==='mengerjakan'){titleStatus=`<span class="inline-block bg-white/20 px-2 sm:px-3 py-1 rounded-full text-[10px] sm:text-xs font-bold ml-2 sm:ml-3 border border-white/10">Sedang Berlangsung</span>`;btnText="Lanjutkan Mengerjakan";}

async function handleTokenConfirmation(e,m){e.preventDefault();const t=$id('input-token-exam').value.toUpperCase(),cL=state.user.kelas||'7A',v=state.tokens[`${m}_${cL}`];if(!v)return showToast(`Token untuk ${m} (${cL}) belum dibuat.`,'error');if(t!==v)return showToast('Token ujian SALAH!','error');const b=$id('btn-submit-token');b.innerHTML='<i class="fas fa-circle-notch fa-spin"></i> Menyiapkan...';b.disabled=true;const isNew=!state.hasilUjian.find(h=>h.mapel===m&&h.nis===state.user.name&&h.status==='mengerjakan');await resumeExam(m,isNew);}

function startAutoSync(){clearInterval(syncInterval);syncInterval=setInterval(async()=>{if(state.cbt.hasUnsyncedAnswers){try{const ls=localStorage.getItem(`cbt_ans_${state.user.name}_${state.cbt.activeMapel}`);if(ls){await db.from('hasil_ujian').update({detail_jawaban:JSON.parse(ls)}).eq('nis',state.user.name).eq('mapel',state.cbt.activeMapel);state.cbt.hasUnsyncedAnswers=false;const ss=$id('sync-status');if(ss)ss.innerHTML='<i class="fas fa-cloud-check text-emerald-500" title="Tersinkronisasi"></i>';}}catch(e){console.error('Sync DB Error');}}},30000);}

async function resumeExam(m,iN=false){
state.cbt.activeMapel=m;
let sd=state.adminSetup.dataSiswa.find(s=>s.nis===state.user.name);
if(!sd)sd={nama_lengkap:state.user.realName,kelas:state.user.kelas||'7A'};
const normalizeJenisSoal=(jenis)=>String(jenis||'').toLowerCase().includes('essay')?'essay':'pg';
const shuffleQuestions=(arr)=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;};
const buildSavedPayload=(qs)=>qs.map(q=>({id:q.id,type:q.type,answer:q.koreksi_manual?'':q.answer,is_correct:q.type==='pg'?isCorrectPGByIndex(q.answer,q.kunci_jawaban,q.options):(q.answer===q.kunci_jawaban),ragu:q.ragu||false,options:q.options,koreksi_manual:q.koreksi_manual}));
try{
if(iN)await db.from('hasil_ujian').insert([{nis:state.user.name,nama_siswa:sd.nama_lengkap,kelas:sd.kelas,mapel:m,status:'mengerjakan'}]);
const{data:sDRaw}=await db.from('soal').select('*').eq('mapel',m).eq('kelas',sd.kelas);
const sD=(sDRaw||[]).map(normalizeSoalRecord);
const lS=localStorage.getItem(`cbt_ans_${state.user.name}_${m}`),pLS=lS?JSON.parse(lS):null;
const cfg=state.pengaturanUjian.find(p=>p.mapel===m&&p.kelas===sd.kelas)||{acakSoal:true,acakJawaban:true};
if(sD&&sD.length>0){
let qs=sD.map(d=>{
const type=normalizeJenisSoal(d.jenis);
let ans=null,ragu=false,savedOpts=null;
if(pLS){const f=pLS.find(x=>String(x.id)===String(d.id));if(f){ans=f.answer;ragu=f.ragu;savedOpts=f.options;}}
let baseOpts=[...(d.opsi_jawaban||[])];
let correctIdx=resolvePGKeyIndex(baseOpts,d.kunci_jawaban);
let correctText=correctIdx>=0?baseOpts[correctIdx]:String(d.kunci_jawaban||'');
let opts=savedOpts||[...baseOpts];
if(type==='pg'&&!savedOpts&&cfg.acakJawaban!==false&&opts.length>0){shuffleQuestions(opts);}
let keyIndex=type==='pg'?opts.findIndex(x=>String(x)===String(correctText)):d.kunci_jawaban;
if(type==='pg'&&keyIndex<0)keyIndex=resolvePGKeyIndex(opts,d.kunci_jawaban);
if(type==='pg'&&ans!==null&&ans!==undefined&&ans!==''&&!Number.isInteger(Number(ans))){const ai=opts.findIndex(x=>String(x)===String(ans));if(ai>=0)ans=String(ai);}
return{id:d.id,type,bobot:d.bobot,text:d.pertanyaan,gambar:getSoalMediaUrl(d),options:opts,kunci_jawaban:type==='pg'?String(keyIndex):d.kunci_jawaban,answer:ans,ragu:ragu||false,koreksi_manual:(type==='essay'&&getKoreksiEssayAI(m,sd.kelas)===false)};
});
// Pengacakan soal dipisah: PG selalu tampil lebih dulu, Essay tampil setelah seluruh PG selesai.
let qsPG=qs.filter(q=>q.type==='pg'),qsEs=qs.filter(q=>q.type==='essay');
if(pLS&&pLS.length===qs.length){
const savedOrder=(id)=>{const idx=pLS.findIndex(x=>String(x.id)===String(id));return idx<0?Number.MAX_SAFE_INTEGER:idx;};
qsPG.sort((a,b)=>savedOrder(a.id)-savedOrder(b.id));
qsEs.sort((a,b)=>savedOrder(a.id)-savedOrder(b.id));
}else if(cfg.acakSoal!==false){
shuffleQuestions(qsPG);
shuffleQuestions(qsEs);
}
qs=[...qsPG,...qsEs];
localStorage.setItem(`cbt_ans_${state.user.name}_${m}`,JSON.stringify(buildSavedPayload(qs)));
state.cbt.questions=qs;
}else showToast('Soal belum ada di database.','info');
}catch(er){console.error(er);}
const jw=findTodayJadwal(m,sd.kelas);
state.cbt.timeLeft=(jw&&jw.durasi?parseInt(jw.durasi):60)*60;
state.cbt.currentIndex=0;
clearInterval(studentTimerInterval);
state.cbt.hasUnsyncedAnswers=false;
state.view='cbt-exam';
startTimer();
startAutoSync();
render();
}


function isManualEssayQuestion(q){
if(!q||q.type!=='essay')return false;
const kelas=state.user?.kelas||state.adminSetup.dataSiswa.find(s=>s.nis===state.user?.name)?.kelas||'';
return getKoreksiEssayAI(state.cbt.activeMapel,kelas)===false;
}
function normalizeEssayManualMode(q){
if(!q||q.type!=='essay')return false;
const manual=isManualEssayQuestion(q);
q.koreksi_manual=manual;
if(manual)q.answer='';
return manual;
}

function resolvePGKeyIndex(options,key){

function persistCBTAnswers(){const dj=state.cbt.questions.map(q=>{const manual=isManualEssayQuestion(q);if(manual)q.answer='';q.koreksi_manual=manual;const correct=q.type==='pg'?isCorrectPGByIndex(q.answer,q.kunci_jawaban,q.options):(q.answer===q.kunci_jawaban);return{id:q.id,type:q.type,answer:manual?'':q.answer,is_correct:correct,ragu:q.ragu,options:q.options,koreksi_manual:manual};});localStorage.setItem(`cbt_ans_${state.user.name}_${state.cbt.activeMapel}`,JSON.stringify(dj));state.cbt.hasUnsyncedAnswers=true;}
function saveAnswer(v,doRender=false){const cur=state.cbt.questions[state.cbt.currentIndex];if(isManualEssayQuestion(cur)){cur.koreksi_manual=true;cur.answer='';persistCBTAnswers();return;}cur.answer=v;persistCBTAnswers();if(doRender)render();}
function saveCurrentAnswerBeforeMove(){
const q=state.cbt.questions[state.cbt.currentIndex];
if(!q)return;
if(q.type==='pg'){
const checked=document.querySelector('input[name="pg-answer"]:checked');
if(checked)saveAnswer(checked.value,false);
return;
}
if(q.type==='essay'&&!isManualEssayQuestion(q)){
const ta=$id('essay-answer');
if(ta)saveAnswer(ta.value,false);
}
}
function saveCurrentEssayBeforeMove(){saveCurrentAnswerBeforeMove();}
function toggleRagu(){saveCurrentAnswerBeforeMove();state.cbt.questions[state.cbt.currentIndex].ragu=!state.cbt.questions[state.cbt.currentIndex].ragu;persistCBTAnswers();render();}
function nextQuestion(){saveCurrentAnswerBeforeMove();if(state.cbt.currentIndex<state.cbt.questions.length-1){state.cbt.currentIndex++;render();}}
function prevQuestion(){saveCurrentAnswerBeforeMove();if(state.cbt.currentIndex>0){state.cbt.currentIndex--;render();}}
function jumpToQuestion(idx){saveCurrentAnswerBeforeMove();state.cbt.currentIndex=idx;render();}
function startTimer(){clearInterval(state.cbt.timerInterval);state.cbt.timerInterval=setInterval(()=>{state.cbt.timeLeft--;const d=$id('timer-display');if(d)d.innerText=formatTime(state.cbt.timeLeft);if(state.cbt.timeLeft<=0){saveCurrentAnswerBeforeMove();clearInterval(state.cbt.timerInterval);finishExam(true);}},1000);}

function confirmSubmit(){
saveCurrentAnswerBeforeMove();
const u=state.cbt.questions.filter(q=>!isManualEssayQuestion(q)&&(q.answer===null||q.answer==='')).length,r=state.cbt.questions.filter(q=>q.ragu).length;let m="Apakah Anda yakin ingin mengakhiri dan mengirim jawaban?";
if(u>0)m=`<strong class="text-rose-500 text-base sm:text-lg">Perhatian!</strong><br>Masih ada <b>${u}</b> soal yang belum dijawab. Yakin mengakhiri ujian?`;else if(r>0)m=`<strong class="text-amber-500 text-base sm:text-lg">Peringatan!</strong><br>Ada <b>${r}</b> soal yang masih Ragu-Ragu. Yakin mengakhiri?`;
showConfirmModal(m,()=>finishExam(false));
}

async function finishExam(isT){
saveCurrentAnswerBeforeMove();
window.onbeforeunload=null;clearInterval(state.cbt.timerInterval);clearInterval(syncInterval);showToast('Menghitung & Mengirim jawaban...','info');
try{
    let skorPG=0,skorEssay=0;
    const dj=state.cbt.questions.map(q=>{
        let is_correct=false,ai_score=0;
        if(q.type==='pg'){
            is_correct=isCorrectPGByIndex(q.answer,q.kunci_jawaban,q.options);
            if(is_correct){skorPG+=(q.bobot||10);ai_score=q.bobot||10;}
        }else if(q.type==='essay'){
            if(isManualEssayQuestion(q)){q.koreksi_manual=true;q.answer='';return{id:q.id,type:q.type,answer:'',is_correct:false,ai_score:0,ragu:q.ragu,options:q.options,koreksi_manual:true};}
            const ans=String(q.answer||'').toLowerCase(),key=String(q.kunci_jawaban||'').toLowerCase(),bobot=q.bobot||20;
            if(key){
                const kA=key.split(',').map(x=>x.trim()).filter(x=>x);let mC=0;
                kA.forEach(x=>{if(ans.includes(x))mC++;});
                if(mC>0)ai_score=bobot;else if(ans.length>15)ai_score=Math.floor(bobot/2);
            }else{
                if(ans.length>20)ai_score=bobot;else if(ans.length>5)ai_score=Math.floor(bobot/2);
            }
            skorEssay+=ai_score;
        }
        const manual=isManualEssayQuestion(q);return{id:q.id,type:q.type,answer:manual?'':q.answer,is_correct,ai_score,ragu:q.ragu,options:q.options,koreksi_manual:manual};
    });
    const totalSkor=skorPG+skorEssay;
    await db.from('hasil_ujian').update({
        status:'selesai',
        skor_pg:skorPG,
        skor_essay:skorEssay,
        total_skor:totalSkor,
        waktu_selesai:new Date(),
        detail_jawaban:dj
    }).eq('nis',state.user.name).eq('mapel',state.cbt.activeMapel);
    localStorage.removeItem(`cbt_ans_${state.user.name}_${state.cbt.activeMapel}`);

    if(APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'https://script.google.com/macros/s/AKfycbw0PUgwdvYFibsOea94_3w8Jod-XtxWxXsX8LxvK7hMYWtdA5q9npBgY0lOhwfGSn5dcw/exec'){
        try{
            const identitas=typeof getExportIdentity==='function'?getExportIdentity():{
                namaLembaga:state.pengaturanUmum.namaLembaga||'',
                namaUjian:state.pengaturanUmum.namaUjian||'',
                tahunAjaran:state.pengaturanUmum.tahunAjaran||'',
                semester:state.pengaturanUmum.semester||''
            };
            await fetch(APPS_SCRIPT_URL,{
                method:'POST',
                mode:'no-cors',
                body:JSON.stringify({
                    nis:state.user.name,
                    namaSiswa:state.user.realName||state.user.name,
                    kelas:state.user.kelas||'',
                    mapel:state.cbt.activeMapel,
                    skorPG,
                    skorEssay,
                    totalSkor,
                    status:'selesai',
                    tahunAjaran:identitas.tahunAjaran,
                    semester:identitas.semester,
                    namaLembaga:identitas.namaLembaga,
                    namaUjian:identitas.namaUjian
                })
            });
        }catch(err){console.warn('Gagal mengirim rekap ke Apps Script:',err);}
    }
    await loadHasilUjianFromDB();
    state.view='cbt-result';
    render();
    showToast(isT?'Waktu habis. Jawaban dikirim.':'Ujian berhasil dikirim.','success');
}catch(e){
    console.error(e);
    showToast('Gagal mengirim jawaban: '+(e.message||'Unknown error'),'error');
}
}

async function forceSubmitMasal(mapel,kelas){showDeleteConfirmModal(`Paksa kumpulkan ujian ${mapel} kelas ${kelas}?`,async()=>{showToast('Memproses penutupan...','info');try{const mhs=state.hasilUjian.filter(h=>h.mapel===mapel&&h.kelas===kelas&&h.status==='mengerjakan');if(mhs.length===0)return showToast('Tidak ada siswa ujian di mapel/kelas ini.','info');for(let h of mhs){let sP=0,sE=0;if(h.detail_jawaban){h.detail_jawaban.forEach(q=>{if(q.type==='pg'&&q.is_correct)sP+=(q.bobot||10);if(q.type==='essay')sE+=(q.ai_score||0);});}await db.from('hasil_ujian').update({status:'selesai',skor_pg:sP,skor_essay:sE,total_skor:sP+sE,waktu_selesai:new Date()}).eq('id',h.id);}showToast(`Selesai ${mhs.length} siswa.`,'success');await loadHasilUjianFromDB();render();}catch(e){showToast('Gagal force submit','error');}});}

function printRekap(){const content=$id('area-cetak-rekap').outerHTML,win=window.open('','','width=900,height=650');if(!win)return showToast('Popup cetak diblokir browser.','error');const header=getPrintHeaderHTML('Laporan Hasil Nilai Ujian');win.document.write(`<html><head><title>Cetak Rekap</title><style>body{font-family:sans-serif;} table{width:100%;border-collapse:collapse;font-size:12px;} th,td{border:1px solid #ddd;padding:8px;text-align:left;} th{background:#f8f9fa;} .text-center{text-align:center;} .text-green-600{color:#16a34a;} .text-red-500{color:#ef4444;}</style></head><body>${header}${content}</body></html>`);win.document.close();win.focus();setTimeout(()=>{win.print();win.close();},250);}
function exportExcelRekap(){const rf=state.adminSetup.rekapFilter||{mapel:'',kelas:'',search:'',showBelum:false};let dH=(state.hasilUjian||[]).filter(h=>h.status==='selesai');if(rf.mapel)dH=dH.filter(h=>h.mapel===rf.mapel);if(rf.kelas)dH=dH.filter(h=>h.kelas===rf.kelas);if(rf.search){const src=rf.search.toLowerCase();dH=dH.filter(h=>(h.nama_siswa||'').toLowerCase().includes(src)||(h.nis||'').toLowerCase().includes(src));}let data=[];if(!rf.showBelum){data=dH.map((h,i)=>{const kkmVal=(state.pengaturanUjian.find(p=>p.mapel===h.mapel&&p.kelas===h.kelas)||{}).kkm||75;return({"No":i+1,"Tahun Ajaran":state.pengaturanUmum.tahunAjaran,"Semester":state.pengaturanUmum.semester,"NISN":h.nis,"Nama Siswa":h.nama_siswa,"Kelas":h.kelas,"Mata Pelajaran":h.mapel,"Skor PG":h.skor_pg||0,"Skor Essay":h.skor_essay||0,"Total Skor":h.total_skor,"KKM":kkmVal,"Keterangan":h.total_skor>=kkmVal?"Tuntas":"Tidak Tuntas","Waktu Submit":new Date(h.waktu_selesai).toLocaleString('id-ID')});});}else{if(!rf.mapel||!rf.kelas)return showToast("Pilih Mapel & Kelas dulu","error");const sK=state.adminSetup.dataSiswa.filter(s=>s.kelas===rf.kelas),sId=state.hasilUjian.filter(h=>h.mapel===rf.mapel&&h.kelas===rf.kelas).map(h=>h.nis);let b=sK.filter(s=>!sId.includes(s.nis));if(rf.search){const src=rf.search.toLowerCase();b=b.filter(s=>(s.nama_lengkap||s.nama||'').toLowerCase().includes(src)||(s.nis||s.nisn||'').toLowerCase().includes(src));}data=b.map((s,i)=>({"No":i+1,"Tahun Ajaran":state.pengaturanUmum.tahunAjaran,"Semester":state.pengaturanUmum.semester,"NISN":s.nis||s.nisn||"-","Nama Siswa":s.nama_lengkap||s.nama||"-","Kelas":s.kelas,"Mata Pelajaran":rf.mapel,"Status":"Belum Mengerjakan"}));}if(data.length===0)return showToast("Tidak ada data","error");const extra=[];if(rf.mapel)extra.push(`Mapel: ${rf.mapel}`);if(rf.kelas)extra.push(`Kelas: ${rf.kelas}`);if(rf.showBelum)extra.push('Status: Belum Mengerjakan');const ws=createSheetWithIdentityHeader(data,extra),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Rekap Nilai");XLSX.writeFile(wb,`Rekap_Nilai_${rf.mapel||'Semua'}_${rf.kelas||'Semua'}.xlsx`);showToast("Export berhasil!","success");}

function importSoalExcel(e){
if(!state.guruSetup.mapel||!state.guruSetup.kelas){showToast('Pilih Mapel & Kelas!','error');e.target.value='';return;}
const f=e.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=async function(ev){
try{
const wb=XLSX.read(ev.target.result,{type:'binary'}),json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
if(!json.length)return showToast('Kosong','error');
const fd=json.map((row,idx)=>{
const j=(row['Jenis (pg/essay)']||'').toLowerCase().trim();
if(!['pg','essay'].includes(j))throw new Error(`Baris ${idx+2}: jenis soal harus pg atau essay`);
let o=null;if(j==='pg')o=[String(row.Opsi_A||''),String(row.Opsi_B||''),String(row.Opsi_C||''),String(row.Opsi_D||'')];
const mediaUrl=String(row.URL_Media||row.Media_URL||row.Gambar_URL||'').trim();
const item={mapel:state.guruSetup.mapel,kelas:state.guruSetup.kelas,bobot:j==='pg'?state.guruSetup.bobotPG:state.guruSetup.bobotEssay,jenis:j,pertanyaan:String(row.Pertanyaan||''),opsi_jawaban:o,kunci_jawaban:String(row.Kunci_Jawaban||'')};
if(mediaUrl)item.gambar_url=mediaUrl;
return item;
});
await writeSoalToDB('insert',fd);
const pgCount=fd.filter(x=>x.jenis==='pg').length,essayCount=fd.filter(x=>x.jenis==='essay').length;
await catatAktivitasPembuatSoal({mapel:state.guruSetup.mapel,kelas:state.guruSetup.kelas,jumlah:fd.length,action:'import_soal',pg:pgCount,essay:essayCount});
showToast('Import sukses','success');await loadDaftarSoal();render();
}catch(err){console.error(err);showToast('Error import: '+getDbErrorMessage(err),'error');}
};
r.readAsBinaryString(f);e.target.value='';
}


function getJumlahSoalGuru(jenis){return (state.guruSetup.daftarSoal||[]).filter(s=>s.jenis===jenis).length;}
function getTargetSoalGuru(jenis){return Number(jenis==='pg'?state.guruSetup.targetPG:state.guruSetup.targetEssay)||0;}
function isSoalLimitReached(jenis){const target=getTargetSoalGuru(jenis);return target>0&&getJumlahSoalGuru(jenis)>=target;}
function getSoalLimitStatusHTML(){
    const cPG=getJumlahSoalGuru('pg'),cE=getJumlahSoalGuru('essay'),tPG=getTargetSoalGuru('pg'),tE=getTargetSoalGuru('essay');
    const pgFull=tPG>0&&cPG>=tPG,esFull=tE>0&&cE>=tE;
    const box=(label,count,target,full,icon)=>`<div class="flex-1 p-3 rounded-xl border ${full?'bg-rose-50 dark:bg-rose-900/20 border-rose-200 dark:border-rose-800/50 text-rose-700 dark:text-rose-300':'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800/50 text-emerald-700 dark:text-emerald-300'}"><div class="flex items-center justify-between gap-3"><div class="font-black text-xs uppercase tracking-wider"><i class="fas ${icon} mr-1.5"></i>${label}</div><div class="font-black text-sm">${count}/${target||'∞'}</div></div><div class="mt-1 text-[11px] font-bold opacity-80">${full?'Batas sudah terpenuhi. Jangan tambah soal jenis ini.':'Masih bisa ditambahkan.'}</div></div>`;
    return `<div id="limit-soal-alert" class="mb-5 flex flex-col sm:flex-row gap-3">${box('Pilihan Ganda',cPG,tPG,pgFull,'fa-list-check')}${box('Essay',cE,tE,esFull,'fa-pen-nib')}</div>`;
}
function refreshQuestionLimitUI(ed=null){
    const sel=$id('input-jenis'),btn=$id('btn-simpan-soal'),warn=$id('limit-soal-alert');
    if(warn)warn.outerHTML=getSoalLimitStatusHTML();
    if(!sel)return;
    if(currentEditSoalId){toggleOpsiJawaban();return;}
    const pgFull=isSoalLimitReached('pg'),esFull=isSoalLimitReached('essay');
    const pgOpt=sel.querySelector('option[value="pg"]'),esOpt=sel.querySelector('option[value="essay"]');
    if(pgOpt){pgOpt.disabled=pgFull;pgOpt.textContent=pgFull?'Pilihan Ganda — BATAS TERPENUHI':'Pilihan Ganda';}
    if(esOpt){esOpt.disabled=esFull;esOpt.textContent=esFull?'Essay — BATAS TERPENUHI':'Essay';}
    if(pgFull&&sel.value==='pg'&&!esFull)sel.value='essay';
    if(esFull&&sel.value==='essay'&&!pgFull)sel.value='pg';
    const allFull=pgFull&&esFull;
    if(btn&&allFull){btn.disabled=true;btn.classList.add('opacity-50','cursor-not-allowed');btn.innerHTML='<i class="fas fa-ban mr-2"></i>Batas Soal Terpenuhi';}
    else if(btn){btn.disabled=false;btn.classList.remove('opacity-50','cursor-not-allowed');btn.innerHTML=currentEditSoalId?'Simpan Perubahan':'Simpan & Lanjut';}
    toggleOpsiJawaban();
}

-10 h-10 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition text-slate-600 dark:text-slate-300" title="Bold"><i class="fas fa-bold"></i></button><button type="button" onclick="formatText('italic')" class="w-10 h-10 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition text-slate-600 dark:text-slate-300" title="Italic"><i class="fas fa-italic"></i></button><button type="button" onclick="formatText('underline')" class="w-10 h-10 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition text-slate-600 dark:text-slate-300" title="Underline"><i class="fas fa-underline"></i></button><div class="w-px h-6 bg-slate-300 dark:bg-slate-600 mx-2 my-auto"></div><button type="button" onclick="formatText('justifyLeft')" class="w-10 h-10 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition text-slate-600 dark:text-slate-300" title="Rata Kiri"><i class="fas fa-align-left"></i></button><button type="button" onclick="formatText('justifyCenter')" class="w-10 h-10 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition text-slate-600 dark:text-slate-300" title="Rata Tengah"><i class="fas fa-align-center"></i></button><button type="button" onclick="formatText('justifyRight')" class="w-10 h-10 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition text-slate-600 dark:text-slate-300" title="Rata Kanan"><i class="fas fa-align-right"></i></button><button type="button" onclick="formatText('justifyFull')" class="w-10 h-10 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition text-slate-600 dark:text-slate-300" title="Justify / Rata Kanan Kiri"><i class="fas fa-align-justify"></i></button>${mathToolbarButton}</div><div id="input-pertanyaan-editor" contenteditable="true" ${isMath?`oninput="updateMathPreview('input-pertanyaan-editor','preview-pertanyaan',true)"`:''} class="w-full p-5 min-h-[160px] bg-white dark:bg-slate-900 outline-none text-base font-medium text-slate-800 dark:text-slate-200 leading-relaxed" placeholder="${questionPlaceholder}">${ed?ed.pertanyaan:''}</div></div>${previewPertanyaanHTML}<div id="container-opsi" class="space-y-4 mb-6">${opsiHTML}<p class="text-xs text-slate-500 font-bold mt-2"><i class="fas fa-info-circle mr-1"></i> ${opsiHelpText}</p></div><div id="container-kunci-essay" class="hidden mb-6"><label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Kata Kunci Essay (Pisahkan dgn koma)</label><textarea id="input-kunci-essay" rows="3" class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-800/50 border-none rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 font-medium" placeholder="Contoh: Fotosintesis, Cahaya Matahari, Klorofil">${ed&&ed.jenis==='essay'?escapeHTML(ed.kunci_jawaban||''):''}</textarea></div><div class="flex justify-end gap-3 pt-6 border-t border-slate-100 dark:border-slate-800"><button type="button" onclick="closeBuatSoalModal()" class="px-6 py-3.5 bg-slate-100 dark:bg-slate-800 rounded-xl font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition">Batal</button><button type="submit" id="btn-simpan-soal" class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg shadow-indigo-500/30 transition">${ed?'Simpan Perubahan':'Simpan & Lanjut'}</button></div></form></div>`;
document.body.appendChild(m);
const form=m.querySelector('form');if(form)form.insertAdjacentHTML('afterbegin',getSoalLimitStatusHTML());
if(isMath)initMathPreviewInModal(ed);
else if(ed&&ed.jenis==='pg'){
const idx=getKunciPGIndexFromSoal(ed);
if(idx>=0&&idx<=3){const r=$id(`radio-${['a','b','c','d'][idx]}`);if(r)r.checked=true;}
}
refreshQuestionLimitUI(ed);
}

function updateProgressUI(){const pP=$id('prog-pg'),pE=$id('prog-es');if(!pP||!pE)return;const cP=state.guruSetup.daftarSoal.filter(s=>s.jenis==='pg').length,cE=state.guruSetup.daftarSoal.filter(s=>s.jenis==='essay').length;pP.innerText=cP;pE.innerText=cE;refreshQuestionLimitUI();}

function closeBuatSoalModal(){const m=$id('buat-soal-modal');if(m)m.remove();render();}

function toggleOpsiJawaban(){const jenisEl=$id('input-jenis');if(!jenisEl)return;const j=jenisEl.value,isPG=j==='pg',showEssayKeyword=j==='essay'&&state.guruSetup.koreksiAIActive,opsiC=$id('container-opsi'),essayC=$id('container-kunci-essay'),essayInput=$id('input-kunci-essay'),bobotInput=$id('input-bobot-soal');if(bobotInput&&!currentEditSoalId)bobotInput.value=isPG?state.guruSetup.bobotPG:state.guruSetup.bobotEssay;if(opsiC)opsiC.classList.toggle('hidden',!isPG);['a','b','c','d'].forEach(k=>{const o=$id(`opsi-${k}`),r=$id(`radio-${k}`);if(o){o.required=isPG;o.disabled=!isPG;}if(r){r.required=isPG;r.disabled=!isPG;}});if(essayC)essayC.classList.toggle('hidden',!showEssayKeyword);if(essayInput)essayInput.disabled=!showEssayKeyword;}

function formatText(cmd){document.execCommand(cmd,false,null);$id('input-pertanyaan-editor').focus();}

async function prepareSaveSoal(e){
    e.preventDefault();const b=$id('btn-simpan-soal');b.disabled=true;b.innerHTML='Memproses...';
    try{
        const j=$id('input-jenis').value,p=$id('input-pertanyaan-editor').innerHTML.trim();let opsi=null,kunci=null;
        if(!p)throw new Error("Pertanyaan tidak boleh kosong!");
        if(!currentEditSoalId&&isSoalLimitReached(j)){
            const label=j==='pg'?'Pilihan Ganda':'Essay';
            throw new Error(`Batas jumlah soal ${label} sudah terpenuhi (${getJumlahSoalGuru(j)}/${getTargetSoalGuru(j)}). Tidak bisa menambah soal ${label} lagi.`);
        }
        if(j==='pg'){
            opsi=[$id('opsi-a').value,$id('opsi-b').value,$id('opsi-c').value,$id('opsi-d').value].map(x=>x.trim());
            if(opsi.some(x=>!x))throw new Error("Semua opsi jawaban harus diisi!");
            const kIdx=document.querySelector('input[name="kunci_pg"]:checked');
            if(!kIdx)throw new Error("Pilih kunci jawaban!");
            kunci=String(parseInt(kIdx.value));
        }else{
            if(state.guruSetup.koreksiAIActive)kunci=($id('input-kunci-essay')?.value||'').trim();
            else if(currentEditSoalId){const oldSoal=state.guruSetup.daftarSoal.find(x=>String(x.id)===String(currentEditSoalId));kunci=oldSoal?.kunci_jawaban||'';}
            else kunci='';
        }
        const imgUrl=($id('input-gambar-url')?.value||'').trim();
        const bobotSoal=parseInt($id('input-bobot-soal')?.value)||(j==='pg'?state.guruSetup.bobotPG:state.guruSetup.bobotEssay);if(bobotSoal<1)throw new Error('Bobot soal harus lebih dari 0.');const payload={mapel:state.guruSetup.mapel,kelas:state.guruSetup.kelas,jenis:j,pertanyaan:p,opsi_jawaban:opsi,kunci_jawaban:kunci,bobot:bobotSoal};
        if(currentEditSoalId||imgUrl)payload.gambar_url=imgUrl||null;
        if(currentEditSoalId){
            await writeSoalToDB('update',payload,currentEditSoalId);
            await catatAktivitasPembuatSoal({mapel:state.guruSetup.mapel,kelas:state.guruSetup.kelas,jenis:j,jumlah:0,action:'edit_soal'});
            showToast('Soal diperbarui!','success');await loadDaftarSoal();closeBuatSoalModal();
        }else{
            await writeSoalToDB('insert',[payload]);
            await catatAktivitasPembuatSoal({mapel:state.guruSetup.mapel,kelas:state.guruSetup.kelas,jenis:j,jumlah:1,action:'buat_soal'});
            showToast('Soal disimpan! Silakan buat soal berikutnya.','success');await loadDaftarSoal();updateProgressUI();resetFormSoalBerikutnya();
        }
    }catch(er){console.error(er);showToast('Gagal simpan soal: '+getDbErrorMessage(er),'error');}
    finally{if(b){b.disabled=false;b.innerHTML=currentEditSoalId?'Simpan Perubahan':'Simpan & Lanjut';}refreshQuestionLimitUI();}
}

function resetFormSoalBerikutnya(){
    const editor=$id('input-pertanyaan-editor');if(editor)editor.innerHTML='';
    const media=$id('input-gambar-url');if(media)media.value='';
    ['a','b','c','d'].forEach(k=>{const o=$id(`opsi-${k}`);if(o)o.value='';const r=$id(`radio-${k}`);if(r)r.checked=false;updateMathPreview(`opsi-${k}`,`preview-opsi-${k}`);});
    const es=$id('input-kunci-essay');if(es)es.value='';
    updateMathPreview('input-pertanyaan-editor','preview-pertanyaan',true);
    toggleOpsiJawaban();
    setTimeout(()=>editor&&editor.focus(),50);
}


async function logout(){
    await db.auth.signOut();state.view='login';state.user=null;state.role=null;clearInterval(state.cbt.timerInterval);clearInterval(syncInterval);if(typeof studentTimerInterval!=='undefined')clearInterval(studentTimerInterval);render();showToast('Berhasil keluar.','info');
}

async function simpanPengaturanUmum(){
    const nl=($id('input-nama-lembaga')?.value||'').trim(),nu=($id('input-nama-ujian')?.value||'').trim(),ta=$id('input-tahun-ajaran').value.trim(),sm=$id('input-semester').value;if(!ta)return showToast('Tahun Ajaran tidak boleh kosong','error');
    state.pengaturanUmum={namaLembaga:nl||'Pondok Pesantren Salafiyah Abu Zairi',namaUjian:nu||'Ujian CBT',tahunAjaran:ta,semester:sm};try{await saveMasterDataToDB('pengaturan_umum',state.pengaturanUmum);showToast('Pengaturan disimpan!','success');render();}catch(e){}
}

function tambahWaktuUjian(m,k){
    showPromptModal('Tambah Waktu Ujian',`Tambahan waktu (menit) untuk ${m} Kelas ${k}?`,'15','number',async(menit)=>{
        if(!menit||isNaN(menit)||parseInt(menit)<=0)return;const idx=state.jadwalUjian.findIndex(x=>x.mapel===m&&x.kelas===k);
        if(idx>=0){state.jadwalUjian[idx].durasi=(parseInt(state.jadwalUjian[idx].durasi)||60)+parseInt(menit);await saveMasterDataToDB('jadwal_ujian',state.jadwalUjian);showToast(`Waktu ujian ditambah ${menit} menit`,'success');render();}else{showToast('Jadwal tidak ditemukan','error');}
    });
}

window.addEventListener('DOMContentLoaded', async () => {
    render();
    const { data: { session } } = await db.auth.getSession();
    if (session) {
        const user = session.user;
        const base = user.email.split('@')[0].trim();
        const role = user.email.split('@')[1].split('.')[0].trim();
        state.role = role;
        state.user = { name: base, authData: user };
        await Promise.all([loadMasterDataFromDB(),loadDataSiswaFromDB(),loadDataGuruFromDB(),loadHasilUjianFromDB()]);
        if(state.role==='siswa'){const s=state.adminSetup.dataSiswa.find(x=>x.nis===base);state.user.realName=s?(s.nama_lengkap||s.nama||base):base;state.user.kelas=s?s.kelas:'7A';state.view='student-dashboard';}
        else if(state.role==='guru'){const g=state.adminSetup.dataGuru.find(x=>x.niy===base);state.user.realName=g?(g.nama||base):base;await loadDaftarSoal();state.view='guru-dashboard';}
        else{state.user.realName='Administrator';await loadDaftarSoal();state.view='admin-dashboard';}
        render();
    }
});
</script>
