async function handleTokenConfirmation(e,m){e.preventDefault();const t=document.getElementById('input-token-exam').value.toUpperCase(),cL=state.user.kelas||'7A',tkKey=`${m}_${cL}`,v=state.tokens[tkKey];if(!v)return showToast(`Token untuk ${m} (${cL}) belum dibuat.`,'error');if(t!==v)return showToast('Token ujian SALAH!','error');const b=document.getElementById('btn-submit-token');b.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menyiapkan Lingkungan Ujian...';b.disabled=true;const isNew=!state.hasilUjian.find(h=>h.mapel===m&&h.nis===state.user.name&&h.status==='mengerjakan');await resumeExam(m,isNew)}

function attachCBTListeners(){window.onbeforeunload=()=>state.view==='cbt-exam'?"Ujian sedang berlangsung, yakin ingin keluar?":null}
function saveAnswer(v){state.cbt.questions[state.cbt.currentIndex].answer=v;const dj=state.cbt.questions.map(q=>({id:q.id,type:q.type,answer:q.answer,is_correct:q.answer===q.kunci_jawaban,ragu:q.ragu}));localStorage.setItem(`cbt_ans_${state.user.name}_${state.cbt.activeMapel}`,JSON.stringify(dj));state.cbt.hasUnsyncedAnswers=true;render()}

function confirmSubmit(){const u=state.cbt.questions.filter(q=>q.answer===null||q.answer==='').length,r=state.cbt.questions.filter(q=>q.ragu).length;let m="Apakah Anda yakin ingin menyelesaikan dan mengirim jawaban ujian ini?";if(u>0)m=`<strong class="text-red-500">Perhatian!</strong> Masih ada ${u} soal yang belum Anda jawab. Yakin ingin mengakhiri ujian sekarang?`;else if(r>0)m=`<strong class="text-amber-500">Perhatian!</strong> Anda masih memiliki ${r} soal yang ditandai Ragu-Ragu. Yakin ingin mengakhiri?`;showConfirmModal(m,()=>finishExam(false))}
function showConfirmModal(msg,onConfirm){const m=document.createElement('div');m.className='fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-md';m.innerHTML=`<div class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl p-8 max-w-sm w-full text-center border dark:border-slate-700"><div class="w-20 h-20 bg-blue-50 dark:bg-slate-800 text-blue-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-5"><i class="fas fa-paper-plane"></i></div><p class="text-lg font-medium mb-8 leading-relaxed">${msg}</p><div class="flex gap-3 justify-center"><button id="btn-cancel" class="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Batal</button><button id="btn-ok" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition-all">Selesai</button></div></div>`;document.body.appendChild(m);document.getElementById('btn-cancel').onclick=()=>m.remove();document.getElementById('btn-ok').onclick=()=>{m.remove();onConfirm()}}

function updateProgressUI(){const pP=document.getElementById('prog-pg'),pE=document.getElementById('prog-es');if(!pP||!pE)return;const cP=state.guruSetup.daftarSoal.filter(s=>s.jenis==='pg').length,cE=state.guruSetup.daftarSoal.filter(s=>s.jenis==='essay').length;pP.innerText=cP;pE.innerText=cE;if(cP>=state.guruSetup.targetPG)pP.classList.add('text-green-600');if(cE>=state.guruSetup.targetEssay)pE.classList.add('text-green-600')}
function closeBuatSoalModal(){const m=document.getElementById('buat-soal-modal');if(m)m.remove();currentEditSoalId=null}
function toggleOpsiJawaban(){const j=document.getElementById('input-jenis').value,cO=document.getElementById('container-opsi'),cK=document.getElementById('container-kunci-essay');if(j==='pg'){cO.classList.remove('hidden');cK.classList.add('hidden');cO.querySelectorAll('input').forEach(i=>i.required=true)}else{cO.classList.add('hidden');cK.classList.remove('hidden');cO.querySelectorAll('input').forEach(i=>i.required=false)}}
async function prepareSaveSoal(e){e.preventDefault();const f=document.getElementById('input-gambar');if(f.files&&f.files[0]){const file=f.files[0],maxSize=2*1024*1024;if(file.size>maxSize){showToast('Maksimal 2MB','error');return}const reader=new FileReader();reader.onload=async(ev)=>{const b64=ev.target.result;await executeSaveSoal(b64)};reader.readAsDataURL(file)}else{let existingMedia=null;if(currentEditSoalId){const os=state.guruSetup.daftarSoal.find(s=>s.id===currentEditSoalId);existingMedia=os?os.gambar_url:null}await executeSaveSoal(existingMedia)}}
async function executeSaveSoal(mediaBase64){const b=document.getElementById('btn-simpan-soal');if(b){b.disabled=true;b.innerHTML='Menyimpan...'}const j=document.getElementById('input-jenis').value,p=document.getElementById('input-pertanyaan').value;let o=null,k=null;if(j==='pg'){o=[document.getElementById('opsi-a').value,document.getElementById('opsi-b').value,document.getElementById('opsi-c').value,document.getElementById('opsi-d').value];const sr=document.querySelector('input[name="kunci_pg"]:checked');if(sr)k=o[parseInt(sr.value)]}else k=document.getElementById('input-kunci-essay').value;const py={mapel:state.guruSetup.mapel,kelas:state.guruSetup.kelas,bobot:j==='pg'?state.guruSetup.bobotPG:state.guruSetup.bobotEssay,jenis:j,pertanyaan:p,opsi_jawaban:o,kunci_jawaban:k,gambar_url:mediaBase64};try{if(currentEditSoalId){const{error}=await supabaseClient.from('soal').update(py).eq('id',currentEditSoalId);if(error)throw error;showToast('Disimpan!','success');closeBuatSoalModal()}else{const{error}=await supabaseClient.from('soal').insert([py]);if(error)throw error;showToast('Disimpan.','success');document.getElementById('input-pertanyaan').value='';document.getElementById('input-gambar').value='';if(j==='pg'){['a','b','c','d'].forEach(x=>document.getElementById(`opsi-${x}`).value='');document.querySelectorAll('input[name="kunci_pg"]').forEach(r=>r.checked=false)}else document.getElementById('input-kunci-essay').value=''}await loadDaftarSoal();render()}catch(er){showToast('Gagal: '+(er.message||'Unknown'),'error')}finally{if(b){b.disabled=false;b.innerHTML=currentEditSoalId?'Simpan Perubahan':'Simpan & Lanjut'}}}
async function logout(){await supabaseClient.auth.signOut();state.view='login';state.user=null;state.role=null;clearInterval(state.cbt.timerInterval);clearInterval(syncInterval);if(typeof studentTimerInterval!=='undefined')clearInterval(studentTimerInterval);render();showToast('Berhasil keluar.','info')}
