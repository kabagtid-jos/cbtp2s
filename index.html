    /* ==========================================

    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const bgColor = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-green-500' : 'bg-blue-500');
        
        toast.className = `${bgColor} text-white px-4 py-3 rounded shadow-lg flex items-center gap-3 toast-enter max-w-sm`;
        toast.innerHTML = `
            <i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
            <span class="text-sm font-medium">${message}</span>
        `;
        
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100%)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function render() {
        const app = document.getElementById('app');

            case 'cbt-exam': app.innerHTML = getCBTExamHTML(); attachCBTListeners(); break;
            case 'cbt-result': app.innerHTML = getCBTResultHTML(); break;
            case 'guru-dashboard':

                // Auto-load bank soal saat membuka dashboard guru
                if (guruActiveTab === 'soal') loadDaftarSoal(); 
                break;
            case 'admin-dashboard': app.innerHTML = getAdminDashboardHTML(); break;
        }

        // Render rumus matematika (KaTeX) setiap kali tampilan berganti
        if (window.renderMathInElement) {
            setTimeout(() => {
                renderMathInElement(document.getElementById('app'), {
                    delimiters: [
                        {left: "$$", right: "$$", display: true}, // Untuk rumus Blok Baru
                        {left: "$", right: "$", display: false}   // Untuk rumus Sebaris (Inline)
                    ]
                });
            }, 100);
        }
    }

    let currentLoginRole = 'siswa';
    function switchLoginRole(role) {
        currentLoginRole = role;
        const roles = ['siswa', 'guru', 'admin'];
        roles.forEach(r => {
            const btn = document.getElementById(`btn-role-${r}`);
            if (btn) {
                if (r === role) {
                    btn.className = 'flex-1 py-2 rounded-md font-medium bg-white shadow text-blue-600 transition';
                } else {
                    btn.className = 'flex-1 py-2 rounded-md font-medium text-slate-500 hover:text-slate-800 transition';
                }
            }
        });

        // Ubah Label dan Placeholder sesuai role
        const labelEl = document.getElementById('label-username');
        const inputEl = document.getElementById('username');
        if (labelEl && inputEl) {
            if (role === 'siswa') {
                labelEl.innerText = 'NIS (Nomor Induk Siswa)';
                inputEl.placeholder = 'Masukkan NIS (Hanya Angka)';
            } else if (role === 'guru') {
                labelEl.innerText = 'NIY (Nomor Induk Yayasan)';
                inputEl.placeholder = 'Masukkan NIY (Hanya Angka)';
            } else {
                labelEl.innerText = 'Username Admin';
                inputEl.placeholder = 'Masukkan Username Bebas';
            }
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value;
        const btnSubmit = document.getElementById('btn-login-submit');

        // Ambil nama asli/dasar jika pengguna tanpa sengaja mengetik beserta @domain
        const baseUsername = usernameInput.split('@')[0].trim();

        // Validasi format angka untuk NIS dan NIY di Frontend
        const isNumber = /^\d+$/.test(baseUsername);
        if (currentLoginRole === 'siswa' && !isNumber) {
            showToast('Siswa harus login menggunakan NIS (Hanya Angka)', 'error');
            return;
        }
        if (currentLoginRole === 'guru' && !isNumber) {
            showToast('Guru harus login menggunakan NIY (Hanya Angka)', 'error');
            return;
        }

        // Ubah tampilan tombol saat loading
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memeriksa...';

        try {
            // Trik Isolasi Role KETAT: Paksa domain email berdasarkan tab yang dipilih.
            // Apapun yang diketik user, kita akan paksa domainnya agar Supabase menolak jika salah role.
            let domain = '';
            if (currentLoginRole === 'siswa') {
                domain = '@siswa.cbt.com';
            } else if (currentLoginRole === 'guru') {
                domain = '@guru.cbt.com';
            } else if (currentLoginRole === 'admin') {
                domain = '@admin.cbt.com';
            }
            
            const emailLogin = baseUsername + domain;

            // PROSES AUTH KE SUPABASE 
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailLogin,
                password: passwordInput,
            });

            if (error) {
                throw error;
            }

            // Validasi Keamanan Ganda: Pastikan data yang dikembalikan Supabase benar-benar cocok
            const returnedEmail = data.user.email;
            if (!returnedEmail.endsWith(domain)) {
                await supabaseClient.auth.signOut(); // Keluarkan jika terjadi ketidaksesuaian
                throw new Error("RoleMismatch");
            }

            // LOGIN BERHASIL
            state.role = currentLoginRole;
            // Ambil nama asli dari input
            state.user = { name: baseUsername, authData: data.user };
            
            if (state.role === 'siswa') {
                state.view = 'token-entry';
            } else if (state.role === 'guru') {
                state.view = 'guru-dashboard';
            } else {
                state.view = 'admin-dashboard';
            }
            
            render();
            showToast(`Login berhasil! Selamat datang.`, 'success');

        } catch (error) {
            // LOGIN GAGAL (Password salah / User tidak ditemukan / Role Mismatch)
            let pesanError = "Terjadi kesalahan saat login.";
            if (error.message.includes("Invalid login credentials")) {
                pesanError = "Username/NIS/NIY atau Password salah untuk role ini!";
            } else if (error.message.includes("Email not confirmed")) {
                pesanError = "Akun belum diverifikasi.";
            } else if (error.message === "RoleMismatch") {
                pesanError = "Akses ditolak: Akun ini bukan untuk role tersebut.";
            }
            showToast(pesanError, 'error');
            
            // Kembalikan tombol seperti semula
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = 'Masuk Aplikasi';
        }
    }

            render();

                            ${q.gambar ? `<div class="mb-5"><img src="${q.gambar}" alt="Gambar Soal" class="max-w-full md:max-w-md h-auto rounded-lg border border-slate-200 shadow-sm"></div>` : ''}

                            <div class="text-base md:text-lg text-slate-800 leading-relaxed font-medium">

    function attachCBTListeners() {
        window.onbeforeunload = function() {
            if(state.view === 'cbt-exam') return "Ujian sedang berlangsung, yakin ingin keluar?";
        };
    }

    function saveAnswer(value) {
        const q = state.cbt.questions[state.cbt.currentIndex];
        q.answer = value;
        render(); 
        showToast('Jawaban tersimpan otomatis', 'success');
    }

    function nextQuestion() {
        if (state.cbt.currentIndex < state.cbt.questions.length - 1) {
            state.cbt.currentIndex++;
            render();
        }
    }

    function prevQuestion() {
        if (state.cbt.currentIndex > 0) {
            state.cbt.currentIndex--;
            render();
        }
    }

    function jumpToQuestion(idx) {
        state.cbt.currentIndex = idx;
        render();
        const grid = document.getElementById('question-grid');
        if(!grid.classList.contains('translate-x-full')) toggleGrid();
    }

    function toggleGrid() {
        const grid = document.getElementById('question-grid');
        const overlay = document.getElementById('grid-overlay');
        
        if (grid.classList.contains('translate-x-full')) {
            grid.classList.remove('hidden');
            setTimeout(() => {
                grid.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            }, 10);
        } else {
            grid.classList.add('translate-x-full');
            overlay.classList.add('hidden');
            setTimeout(() => grid.classList.add('hidden'), 300);
        }
    }

    function startTimer() {
        clearInterval(state.cbt.timerInterval);
        state.cbt.timerInterval = setInterval(() => {
            state.cbt.timeLeft--;
            const display = document.getElementById('timer-display');
            if(display) display.innerText = formatTime(state.cbt.timeLeft);
            
            if (state.cbt.timeLeft <= 0) {
                clearInterval(state.cbt.timerInterval);
                finishExam(true); 
            }
        }, 1000);
    }

    function confirmSubmit() {
        const unanswered = state.cbt.questions.filter(q => q.answer === null || q.answer === '').length;
        let msg = "Apakah Anda yakin ingin menyelesaikan ujian?";
        if(unanswered > 0) msg = `Masih ada ${unanswered} soal yang belum dijawab. Yakin ingin mengakhiri?`;
        
        showConfirmModal(msg, () => finishExam(false));
    }

    function showConfirmModal(msg, onConfirm) {
        const modal = document.createElement('div');
        modal.className = 'fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm';
        modal.innerHTML = `
            <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center">
                <i class="fas fa-question-circle text-4xl text-blue-500 mb-4"></i>
                <p class="text-slate-800 font-medium mb-6">${msg}</p>
                <div class="flex gap-3 justify-center">
                    <button id="btn-cancel" class="px-4 py-2 rounded-lg bg-slate-200 text-slate-700 font-medium hover:bg-slate-300">Batal</button>
                    <button id="btn-ok" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700">Yakin Selesai</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.getElementById('btn-cancel').onclick = () => modal.remove();
        document.getElementById('btn-ok').onclick = () => {
            modal.remove();
            onConfirm();
        };
    }

    async function finishExam(isTimeout) {
        window.onbeforeunload = null; 
        clearInterval(state.cbt.timerInterval);
        
        showToast('Mengirim jawaban...', 'info');

        try {
            if (APPS_SCRIPT_URL !== 'GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT_ANDA') {
                let skorPG = 0;
                state.cbt.questions.forEach(q => {
                    if (q.type === 'pg' && q.answer) skorPG += 20; 
                });

                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        nis: state.user.name,
                        namaSiswa: state.user.name,
                        token: state.examToken,
                        skorPG: skorPG,
                        skorEssay: 0
                    })
                });
            } else {
                console.warn('URL Apps Script belum diisi!');
            }

            if (isTimeout) {
                showToast('Waktu habis! Jawaban otomatis dikirim.', 'info');
            } else {
                showToast('Ujian selesai. Jawaban berhasil dikirim.', 'success');
            }
            
            state.view = 'cbt-result';
            render();

        } catch (error) {
            showToast('Terjadi kesalahan saat mengirim jawaban.', 'error');
            console.error('Error submitting exam:', error);
        }
    }

    function updateGuruSetup(key, value) {
        if(key === 'bobotPG' || key === 'bobotEssay' || key === 'targetPG' || key === 'targetEssay') {
            state.guruSetup[key] = parseInt(value) || 0;
        } else {
            state.guruSetup[key] = value;
        }
        
        // Sinkronkan state untuk progress modal (tanpa harus memuat ulang DB terus menerus)
        if (state.guruSetup.mapel && state.guruSetup.kelas && state.guruSetup.bankSoal) {
            const activeGroup = state.guruSetup.bankSoal.find(g => g.mapel === state.guruSetup.mapel && g.kelas === state.guruSetup.kelas);
            state.guruSetup.daftarSoal = activeGroup ? activeGroup.soalList : [];
            updateProgressUI();
        }
    }

    async function loadDaftarSoal() {
        try {
            const tbody = document.getElementById('table-body-bank-soal');
            if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-blue-500"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat data...</td></tr>';

            // Ambil SEMUA soal untuk dikelompokkan
            const { data, error } = await supabaseClient
                .from('soal')
                .select('*')
                .order('mapel', { ascending: true });
            
            if (error) throw error;
            
            // Logika Pengelompokan (Grouping) berdasarkan Mapel & Kelas
            const grouped = {};
            (data || []).forEach(q => {
                const key = `${q.mapel}_${q.kelas}`;
                if (!grouped[key]) {
                    grouped[key] = { mapel: q.mapel, kelas: q.kelas, pg: 0, essay: 0, soalList: [] };
                }
                if (q.jenis === 'pg') grouped[key].pg++;
                if (q.jenis === 'essay') grouped[key].essay++;
                grouped[key].soalList.push(q);
            });
            
            state.guruSetup.bankSoal = Object.values(grouped);
            
            // Sinkronkan daftarSoal untuk Modal Buat Soal aktif
            if (state.guruSetup.mapel && state.guruSetup.kelas) {
                const activeGroup = state.guruSetup.bankSoal.find(g => g.mapel === state.guruSetup.mapel && g.kelas === state.guruSetup.kelas);
                state.guruSetup.daftarSoal = activeGroup ? activeGroup.soalList : [];
                updateProgressUI();
            } else {
                state.guruSetup.daftarSoal = [];
            }

            renderTableBankSoal();

        } catch (error) {
            console.error('Error load soal:', error);
            showToast('Gagal memuat bank soal dari database.', 'error');
        }
    }

            tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-slate-500">Belum ada bank soal tersimpan. Buat atau Import soal pertama Anda.</td></tr>';
            return;

        tbody.innerHTML = state.guruSetup.bankSoal.map((b, idx) => `
            <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                <td class="p-3 text-slate-800 font-medium">${b.mapel}</td>
                <td class="p-3 text-slate-600">${b.kelas}</td>
                <td class="p-3 text-center text-slate-600">${b.pg}</td>

                <td class="p-3 text-slate-600 truncate max-w-[120px]">${s.kunci_jawaban || '-'}</td>
                <td class="p-3 text-center whitespace-nowrap">
                    <button onclick="editSoal(${s.id})" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-1.5 rounded mr-1" title="Edit"><i class="fas fa-edit"></i></button>
                    <button onclick="hapusSoal(${s.id})" class="text-red-500 hover:text-red-700 bg-red-50 p-1.5 rounded" title="Hapus"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `).join('');

        if(group.soalList.length === 0) {
            tableContent = '<tr><td colspan="5" class="text-center p-4 text-slate-500">Tidak ada soal.</td></tr>';
        }

        modal.innerHTML = `
            <div class="bg-white rounded-xl shadow-2xl p-6 max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b pb-3">
                    <h3 class="text-xl font-bold text-slate-800">Detail Soal: ${mapel} - Kelas ${kelas}</h3>
                    <button onclick="closeDetailBankSoalModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div class="overflow-y-auto flex-1 hide-scroll border rounded-lg">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="sticky top-0 bg-slate-100 z-10">
                            <tr class="text-slate-600 border-b">
                                <th class="p-3 font-medium w-12">No</th>
                                <th class="p-3 font-medium w-24">Jenis</th>
                                <th class="p-3 font-medium">Pertanyaan</th>
                                <th class="p-3 font-medium w-32">Kunci</th>
                                <th class="p-3 font-medium w-24 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="detail-table-body">
                            ${tableContent}
                        </tbody>
                    </table>
                </div>
                <div class="pt-4 mt-4 border-t text-right">
                    <button type="button" onclick="closeDetailBankSoalModal()" class="px-5 py-2 rounded-lg bg-slate-200 text-slate-700 font-medium hover:bg-slate-300 transition">Tutup</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);

        // Render ulang KaTeX untuk pop-up detail
        if (window.renderMathInElement) {
            setTimeout(() => {
                renderMathInElement(modal, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "$", right: "$", display: false}
                    ]
                });
            }, 100);
        }
    }

    function closeDetailBankSoalModal() {
        const modal = document.getElementById('detail-bank-soal-modal');
        if (modal) modal.remove();
    }

    // --- FUNGSI HAPUS ---
    async function hapusSoal(id) {
        if (!confirm('Anda yakin ingin menghapus soal ini?')) return;
        
        try {
            const { error } = await supabaseClient.from('soal').delete().eq('id', id);
            if (error) throw error;
            
            showToast('Soal berhasil dihapus', 'success');
            
            // Tutup modal detail jika sedang terbuka, agar guru melihat tabel utama diperbarui
            closeDetailBankSoalModal(); 
            await loadDaftarSoal();
        } catch (err) {
            showToast('Gagal menghapus: ' + err.message, 'error');
        }
    }

    async function hapusBankSoal(idx) {
        const group = state.guruSetup.bankSoal[idx];
        if (!group) return;
        const mapel = group.mapel;
        const kelas = group.kelas;

        if (!confirm(`PERINGATAN! Anda yakin ingin menghapus SELURUH soal untuk mata pelajaran ${mapel} - Kelas ${kelas}? Data yang dihapus tidak dapat dikembalikan.`)) return;
        try {
            const { error } = await supabaseClient.from('soal').delete()
                .eq('mapel', mapel)
                .eq('kelas', kelas);
            if (error) throw error;
            
            showToast(`Bank soal ${mapel} - ${kelas} berhasil dihapus.`, 'success');
            await loadDaftarSoal();
        } catch(err) {
            showToast('Gagal menghapus bank soal: ' + err.message, 'error');
        }
    }

    // --- FUNGSI EDIT ---
    let currentEditSoalId = null; // Variable track Edit Mode
    function editSoal(id) {
        // Cari soal dari seluruh bank soal yang telah di-load
        let soalToEdit = null;
        if(state.guruSetup.bankSoal) {
            for(let group of state.guruSetup.bankSoal) {
                soalToEdit = group.soalList.find(s => s.id === id);
                if(soalToEdit) break;
            }
        }
        
        if (!soalToEdit) return;
        
        // Tutup modal detail agar tidak menumpuk dengan modal Edit
        closeDetailBankSoalModal();
        
        currentEditSoalId = id;
        
        // Pastikan dropdown Mapel dan Kelas di setup utama menyesuaikan dengan soal yang mau di-edit
        updateGuruSetup('mapel', soalToEdit.mapel);
        updateGuruSetup('kelas', soalToEdit.kelas);
        
        const selMapel = document.getElementById('setup-mapel');
        if(selMapel) selMapel.value = soalToEdit.mapel;
        const selKelas = document.getElementById('setup-kelas');
        if(selKelas) selKelas.value = soalToEdit.kelas;

        openBuatSoalModal(soalToEdit);
    }

    function cekSetupDanBukaModal() {
        if (!state.guruSetup.mapel || !state.guruSetup.kelas) {
            showToast('Silakan pilih Mata Pelajaran dan Kelas di bagian Pengaturan Identitas Ujian terlebih dahulu!', 'error');
            return;
        }
        currentEditSoalId = null; // Mode Buat Baru
        openBuatSoalModal();
    }

    function downloadTemplateSoalExcel() {
        // Mendefinisikan struktur baris Excel
        const ws_data = [
            ["Jenis (pg/essay)", "Pertanyaan", "Opsi_A", "Opsi_B", "Opsi_C", "Opsi_D", "Kunci_Jawaban", "Gambar_URL"],
            ["pg", "Berapa hasil dari $1+1$?", "1", "2", "3", "4", "2", ""],
            ["essay", "Jelaskan proses fotosintesis!", "", "", "", "", "Cahaya Matahari", ""]
        ];
        
        // Konversi ke Worksheet
        const ws = XLSX.utils.aoa_to_sheet(ws_data);
        
        // Merapikan lebar kolom agar enak dilihat
        const wscols = [
            {wch: 18}, // Jenis
            {wch: 50}, // Pertanyaan
            {wch: 15}, // Opsi_A
            {wch: 15}, // Opsi_B
            {wch: 15}, // Opsi_C
            {wch: 15}, // Opsi_D
            {wch: 20}, // Kunci_Jawaban
            {wch: 30}  // Gambar_URL
        ];
        ws['!cols'] = wscols;

        // Membuat file Excel dan mengunduh
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Template_Soal");
        XLSX.writeFile(wb, "Template_Soal_CBT.xlsx");
        
        showToast('Template Excel berhasil diunduh.', 'success');
    }

    function importSoalExcel(event) {
        if (!state.guruSetup.mapel || !state.guruSetup.kelas) {
            showToast('Pilih Mapel dan Kelas terlebih dahulu di Pengaturan Identitas Ujian!', 'error');
            event.target.value = ''; // Reset input file
            return;
        }

        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                showToast('Membaca file Excel...', 'info');
                const data = e.target.result;
                const workbook = XLSX.read(data, {type: 'binary'});
                
                // Ambil sheet pertama
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                
                // Konversi isi sheet ke JSON
                const json = XLSX.utils.sheet_to_json(worksheet);

                if(json.length === 0) {
                    showToast('File Excel kosong atau format tidak sesuai.', 'error');
                    return;
                }

                showToast(`Memproses ${json.length} soal ke database...`, 'info');
                
                // Format data agar sesuai dengan struktur Database Supabase kita
                const formattedData = json.map(row => {
                    const jenis = (row['Jenis (pg/essay)'] || '').toLowerCase().trim();
                    let opsi_jawaban = null;
                    if(jenis === 'pg') {
                        opsi_jawaban = [
                            String(row['Opsi_A'] || ''), 
                            String(row['Opsi_B'] || ''), 
                            String(row['Opsi_C'] || ''), 
                            String(row['Opsi_D'] || '')
                        ];
                    }
                    
                    return {
                        mapel: state.guruSetup.mapel,
                        kelas: state.guruSetup.kelas,
                        bobot: jenis === 'pg' ? state.guruSetup.bobotPG : state.guruSetup.bobotEssay,
                        jenis: jenis,
                        pertanyaan: String(row['Pertanyaan'] || ''),
                        opsi_jawaban: opsi_jawaban,
                        kunci_jawaban: String(row['Kunci_Jawaban'] || ''),
                        gambar_url: row['Gambar_URL'] || null
                    };
                });

                // Proses Upload Massal ke Supabase
                const { error } = await supabaseClient.from('soal').insert(formattedData);
                if(error) throw error;

                showToast(`Sukses! ${json.length} soal berhasil diimport.`, 'success');
                loadDaftarSoal(); // Refresh tabel setelah import
            } catch (err) {
                console.error('Error import excel:', err);
                showToast('Gagal import: ' + err.message, 'error');
            }
        };
        
        reader.readAsBinaryString(file);
        event.target.value = ''; // Reset input agar bisa upload file yang sama jika gagal
    }

    // --- FITUR GURU: BUAT SOAL MANUAL ---
    function openBuatSoalModal(editData = null) {
        const modal = document.createElement('div');
        modal.id = 'buat-soal-modal';
        modal.className = 'fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm';
        
        // Hitung Progress Saat Ini
        const countPG = state.guruSetup.daftarSoal.filter(s => s.jenis === 'pg').length;
        const countEssay = state.guruSetup.daftarSoal.filter(s => s.jenis === 'essay').length;

        modal.innerHTML = `
            <div class="bg-white rounded-xl shadow-2xl p-6 max-w-3xl w-full max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4 border-b pb-3">
                    <h3 class="text-xl font-bold text-slate-800">${editData ? 'Edit Soal' : 'Buat Soal Baru'}</h3>
                    <button onclick="closeBuatSoalModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
                </div>
                
                <div class="mb-4 p-3 bg-blue-50 text-blue-800 rounded-lg text-sm border border-blue-100 flex justify-between items-center">
                    <div>
                        <strong>${state.guruSetup.mapel}</strong> (Kelas ${state.guruSetup.kelas}). <br>
                        <span class="text-xs text-blue-600">Bobot disesuaikan pengaturan.</span>
                    </div>
                    <div class="text-right bg-white px-3 py-1.5 rounded border border-blue-200 shadow-sm">
                        <div class="font-bold text-xs text-slate-500 uppercase tracking-wide border-b pb-1 mb-1">Progress Ujian</div>
                        <div class="text-xs font-medium">PG: <span id="prog-pg" class="${countPG >= state.guruSetup.targetPG ? 'text-green-600' : ''}">${countPG}</span> / ${state.guruSetup.targetPG}</div>
                        <div class="text-xs font-medium">Essay: <span id="prog-es" class="${countEssay >= state.guruSetup.targetEssay ? 'text-green-600' : ''}">${countEssay}</span> / ${state.guruSetup.targetEssay}</div>
                    </div>
                </div>

                <form onsubmit="saveSoal(event)" id="form-buat-soal" class="space-y-4 text-left">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Soal</label>
                        <select id="input-jenis" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50" onchange="toggleOpsiJawaban()" ${editData ? 'disabled' : ''}>
                            <option value="pg" ${editData && editData.jenis === 'pg' ? 'selected' : ''}>Pilihan Ganda</option>
                            <option value="essay" ${editData && editData.jenis === 'essay' ? 'selected' : ''}>Essay</option>
                        </select>
                        ${editData ? '<p class="text-xs text-red-400 mt-1">Jenis soal tidak dapat diubah saat mode Edit.</p>' : ''}
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Gambar (Opsional)</label>
                        <input type="file" id="input-gambar" accept="image/*" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        ${editData && editData.gambar_url ? `<p class="text-xs text-blue-500 mt-1"><i class="fas fa-check"></i> Soal ini sudah memiliki gambar.</p>` : ''}
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pertanyaan <span class="text-red-500">*</span></label>
                        <textarea id="input-pertanyaan" required rows="3" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ketik pertanyaan... (Gunakan $rumus$ untuk matematika sebaris)">${editData ? editData.pertanyaan : ''}</textarea>
                    </div>
                    
                    <div id="container-opsi" class="space-y-3">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Opsi Jawaban & Kunci</label>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunci_pg" value="0" id="radio-a" required class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="font-bold text-slate-700 w-5">A.</span>
                            <input type="text" id="opsi-a" class="flex-1 px-3 py-1.5 border border-slate-300 rounded outline-none focus:border-blue-500" placeholder="Pilihan A" required value="${editData && editData.jenis === 'pg' ? editData.opsi_jawaban[0] : ''}">
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunci_pg" value="1" id="radio-b" required class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="font-bold text-slate-700 w-5">B.</span>
                            <input type="text" id="opsi-b" class="flex-1 px-3 py-1.5 border border-slate-300 rounded outline-none focus:border-blue-500" placeholder="Pilihan B" required value="${editData && editData.jenis === 'pg' ? editData.opsi_jawaban[1] : ''}">
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunci_pg" value="2" id="radio-c" required class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="font-bold text-slate-700 w-5">C.</span>
                            <input type="text" id="opsi-c" class="flex-1 px-3 py-1.5 border border-slate-300 rounded outline-none focus:border-blue-500" placeholder="Pilihan C" required value="${editData && editData.jenis === 'pg' ? editData.opsi_jawaban[2] : ''}">
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunci_pg" value="3" id="radio-d" required class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="font-bold text-slate-700 w-5">D.</span>
                            <input type="text" id="opsi-d" class="flex-1 px-3 py-1.5 border border-slate-300 rounded outline-none focus:border-blue-500" placeholder="Pilihan D" required value="${editData && editData.jenis === 'pg' ? editData.opsi_jawaban[3] : ''}">
                        </div>
                        <p class="text-xs text-slate-500 mt-1"><i class="fas fa-info-circle"></i> Pilih salah satu radio button di sebelah kiri sebagai Kunci Jawaban.</p>
                    </div>

                    <div id="container-kunci-essay" class="hidden">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Kata Kunci Jawaban (Untuk Koreksi AI)</label>
                        <textarea id="input-kunci-essay" rows="2" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: merdeka, proklamasi, 1945...">${editData && editData.jenis === 'essay' ? editData.kunci_jawaban : ''}</textarea>
                    </div>

                    <div class="pt-4 flex justify-end gap-3 border-t mt-4">
                        <button type="button" onclick="closeBuatSoalModal()" class="px-5 py-2 rounded-lg bg-slate-200 text-slate-700 font-medium hover:bg-slate-300 transition">Tutup</button>
                        <button type="submit" id="btn-simpan-soal" class="px-5 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 transition flex items-center gap-2">
                            <i class="fas ${editData ? 'fa-check' : 'fa-paper-plane'}"></i> ${editData ? 'Simpan Perubahan' : 'Simpan & Lanjut'}
                        </button>
                    </div>
                </form>
            </div>
        `;
        document.body.appendChild(modal);
        
        // Jalankan toggle untuk memastikan form menyesuaikan PG/Essay
        toggleOpsiJawaban();

        // Jika mode edit PG, tandai radio button kuncinya
        if (editData && editData.jenis === 'pg' && editData.kunci_jawaban) {
            const indexKunci = editData.opsi_jawaban.indexOf(editData.kunci_jawaban);
            if (indexKunci === 0) document.getElementById('radio-a').checked = true;
            if (indexKunci === 1) document.getElementById('radio-b').checked = true;
            if (indexKunci === 2) document.getElementById('radio-c').checked = true;
            if (indexKunci === 3) document.getElementById('radio-d').checked = true;
        }
    }

    function updateProgressUI() {
        const progPG = document.getElementById('prog-pg');
        const progEs = document.getElementById('prog-es');
        if(!progPG || !progEs) return;

        const countPG = state.guruSetup.daftarSoal.filter(s => s.jenis === 'pg').length;
        const countEssay = state.guruSetup.daftarSoal.filter(s => s.jenis === 'essay').length;
        
        progPG.innerText = countPG;
        progEs.innerText = countEssay;
        
        if(countPG >= state.guruSetup.targetPG) progPG.classList.add('text-green-600');
        if(countEssay >= state.guruSetup.targetEssay) progEs.classList.add('text-green-600');
    }

    function closeBuatSoalModal() {
        const modal = document.getElementById('buat-soal-modal');
        if (modal) modal.remove();
        currentEditSoalId = null; // Reset track edit
    }

    function toggleOpsiJawaban() {
        const jenis = document.getElementById('input-jenis').value;
        const containerOpsi = document.getElementById('container-opsi');
        const containerKunciEssay = document.getElementById('container-kunci-essay');
        const opsiInputs = containerOpsi.querySelectorAll('input[type="text"], input[type="radio"]');

        if (jenis === 'pg') {
            containerOpsi.classList.remove('hidden');
            containerKunciEssay.classList.add('hidden');
            opsiInputs.forEach(input => input.required = true);
        } else {
            containerOpsi.classList.add('hidden');
            containerKunciEssay.classList.remove('hidden');
            opsiInputs.forEach(input => input.required = false);
        }
    }

    async function saveSoal(e) {
        e.preventDefault();
        const btnSimpan = document.getElementById('btn-simpan-soal');
        btnSimpan.disabled = true;
        btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

        // Mengambil Mapel, Kelas, dan Bobot otomatis dari state Dashboard
        const mapel = state.guruSetup.mapel;
        const kelas = state.guruSetup.kelas;
        const jenis = document.getElementById('input-jenis').value;
        const bobot = jenis === 'pg' ? state.guruSetup.bobotPG : state.guruSetup.bobotEssay;
        
        const pertanyaan = document.getElementById('input-pertanyaan').value;
        const fileInput = document.getElementById('input-gambar');
        
        let gambarUrl = null; // Pada mode edit, idealnya mempertahankan gambar lama jika tidak upload baru
        if (fileInput.files && fileInput.files[0]) {
            gambarUrl = URL.createObjectURL(fileInput.files[0]); // Object URL sementara
        } else if (currentEditSoalId) {
             const oldSoal = state.guruSetup.daftarSoal.find(s => s.id === currentEditSoalId);
             gambarUrl = oldSoal ? oldSoal.gambar_url : null;
        }

        let opsi_jawaban = null;
        let kunci_jawaban = null;

        if (jenis === 'pg') {
            const opsiA = document.getElementById('opsi-a').value;
            const opsiB = document.getElementById('opsi-b').value;
            const opsiC = document.getElementById('opsi-c').value;
            const opsiD = document.getElementById('opsi-d').value;
            opsi_jawaban = [opsiA, opsiB, opsiC, opsiD];
            
            // Ambil opsi mana yang ditandai sebagai kunci (0, 1, 2, 3)
            const selectedRadio = document.querySelector('input[name="kunci_pg"]:checked');
            if (selectedRadio) {
                const indexKunci = parseInt(selectedRadio.value);
                kunci_jawaban = opsi_jawaban[indexKunci]; // Simpan teks jawaban aslinya
            }
        } else {
            kunci_jawaban = document.getElementById('input-kunci-essay').value;
        }

        const payload = { 
            mapel: mapel,
            kelas: kelas,
            bobot: bobot,
            jenis: jenis, 
            pertanyaan: pertanyaan, 
            opsi_jawaban: opsi_jawaban, 
            kunci_jawaban: kunci_jawaban,
            gambar_url: gambarUrl 
        };

        try {
            if (currentEditSoalId) {
                // UPDATE SOAL
                const { error } = await supabaseClient.from('soal').update(payload).eq('id', currentEditSoalId);
                if (error) throw error;
                showToast('Perubahan soal berhasil disimpan!', 'success');
                closeBuatSoalModal(); // Tutup jika update
            } else {
                // INSERT SOAL BARU
                const { error } = await supabaseClient.from('soal').insert([payload]);
                if (error) throw error;
                
                showToast('Soal berhasil ditambahkan. Lanjut soal berikutnya.', 'success');
                
                // MENGOSONGKAN FORM AGAR BISA LANJUT (Continuous Input)
                document.getElementById('input-pertanyaan').value = '';
                document.getElementById('input-gambar').value = '';
                if(jenis === 'pg') {
                    document.getElementById('opsi-a').value = '';
                    document.getElementById('opsi-b').value = '';
                    document.getElementById('opsi-c').value = '';
                    document.getElementById('opsi-d').value = '';
                    document.querySelectorAll('input[name="kunci_pg"]').forEach(r => r.checked = false);
                } else {
                    document.getElementById('input-kunci-essay').value = '';
                }
            }

            // Memuat ulang daftar soal di balik layar (agar tabel ter-update & angka progress berubah)
            await loadDaftarSoal();

        } catch (error) {
            console.error('Error saving soal:', error);
            showToast('Gagal menyimpan: ' + error.message, 'error');
        } finally {
            if(document.getElementById('btn-simpan-soal')) {
                btnSimpan.disabled = false;
                btnSimpan.innerHTML = `<i class="fas ${currentEditSoalId ? 'fa-check' : 'fa-paper-plane'}"></i> ${currentEditSoalId ? 'Simpan Perubahan' : 'Simpan & Lanjut'}`;
            }
        }
    }
    // --- AKHIR FITUR GURU ---

    async function logout() {
        // PERBAIKAN 4: Memanggil supabaseClient untuk fitur keluar
        await supabaseClient.auth.signOut();
        
        state.view = 'login';
        state.user = null;
        state.role = null;
        clearInterval(state.cbt.timerInterval);
        render();
        showToast('Anda telah berhasil keluar.', 'info');
    }

    // Initialize App
    window.onload = render;

</script>
