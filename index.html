function getLoginHTML(){return`<div class="flex-1 flex items-center justify-center bg-slate-100 p-4"><div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden"><div class="bg-blue-600 p-6 text-center text-white"><i class="fas fa-graduation-cap text-4xl mb-2"></i><h1 class="text-2xl font-bold">CBT P2S Abu Zairi</h1><p class="text-blue-100 text-sm mt-1">Sistem Ujian Berbasis Komputer</p></div><div class="p-6 md:p-8"><div class="flex gap-2 mb-6 bg-slate-100 p-1 rounded-lg"><button onclick="switchLoginRole('siswa')" id="btn-role-siswa" class="flex-1 py-2 rounded-md font-medium bg-white shadow text-blue-600 transition">Siswa</button><button onclick="switchLoginRole('guru')" id="btn-role-guru" class="flex-1 py-2 rounded-md font-medium text-slate-500 hover:text-slate-800 transition">Guru</button><button onclick="switchLoginRole('admin')" id="btn-role-admin" class="flex-1 py-2 rounded-md font-medium text-slate-500 hover:text-slate-800 transition">Admin</button></div><form id="login-form" onsubmit="handleLogin(event)" class="space-y-4"><div><label id="label-username" class="block text-sm font-medium text-slate-700 mb-1">NIS (Nomor Induk Siswa)</label><input type="text" id="username" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Masukkan NIS (Hanya Angka)"></div><div><label class="block text-sm font-medium text-slate-700 mb-1">Password</label><input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Masukkan password"></div><button type="submit" id="btn-login-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition mt-4 flex justify-center items-center gap-2">Masuk Aplikasi</button></form></div></div></div>`}

async function handleLogin(e){e.preventDefault();const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,btn=document.getElementById('btn-login-submit'),base=u.split('@')[0].trim(),isNum=/^\d+$/.test(base);if(currentLoginRole==='siswa'&&!isNum)return showToast('Siswa harus login menggunakan NIS (Hanya Angka)','error');if(currentLoginRole==='guru'&&!isNum)return showToast('Guru harus login menggunakan NIY (Hanya Angka)','error');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Memeriksa...';try{let d='';if(currentLoginRole==='siswa')d='@siswa.cbt.com';else if(currentLoginRole==='guru')d='@guru.cbt.com';else if(currentLoginRole==='admin')d='@admin.cbt.com';const email=base+d;const{data,error}=await supabaseClient.auth.signInWithPassword({email:email,password:p});if(error)throw error;if(!data.user.email.endsWith(d)){await supabaseClient.auth.signOut();throw new Error("RoleMismatch")}state.role=currentLoginRole;state.user={name:base,authData:data.user};await loadMasterDataFromDB();if(state.role==='siswa')state.view='token-entry';else if(state.role==='guru')state.view='guru-dashboard';else state.view='admin-dashboard';render();showToast(`Login berhasil! Selamat datang.`,'success')}catch(error){let m="Terjadi kesalahan saat login.";if(error.message.includes("Invalid login credentials"))m="Username/Password salah untuk role ini!";else if(error.message.includes("Email not confirmed"))m="Akun belum diverifikasi.";else if(error.message==="RoleMismatch")m="Akses ditolak: Akun ini bukan untuk role tersebut.";showToast(m,'error');btn.disabled=false;btn.innerHTML='Masuk Aplikasi'}}
function getTokenEntryHTML(){return`<div class="flex flex-col h-full bg-slate-50"><header class="bg-white border-b px-4 py-3 flex justify-between items-center shadow-sm"><div class="flex items-center gap-2"><i class="fas fa-graduation-cap text-blue-600 text-xl"></i><span class="font-bold text-slate-800">CBT P2S</span></div><div class="flex items-center gap-3"><span class="text-sm font-medium text-slate-600"><i class="fas fa-user-circle mr-1"></i> ${state.user.name}</span><button onclick="logout()" class="text-red-500 hover:text-red-700 text-sm"><i class="fas fa-sign-out-alt"></i></button></div></header><div class="flex-1 flex items-center justify-center p-4"><div class="bg-white rounded-xl shadow-md p-6 max-w-sm w-full text-center"><div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4"><i class="fas fa-key"></i></div><h2 class="text-xl font-bold mb-2">Token Ujian</h2><p class="text-sm text-slate-500 mb-6">Silakan masukkan token ujian yang diberikan oleh pengawas.</p><form onsubmit="handleToken(event)"><input type="text" id="token-input" required class="w-full text-center tracking-widest uppercase font-bold text-lg px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none mb-4" placeholder="XXXXXX"><button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">Mulai Kerjakan</button></form></div></div></div>`}
function handleToken(e){e.preventDefault();const t=document.getElementById('token-input').value.toUpperCase();if(t===state.examToken){state.view='cbt-exam';startTimer();render();showToast('Token valid. Ujian dimulai!','success')}else{showToast('Token tidak valid! (Hint: ABUZAIRI2026)','error')}}
function getCBTExamHTML(){const q=state.cbt.questions[state.cbt.currentIndex],isLast=state.cbt.currentIndex===state.cbt.questions.length-1,isFirst=state.cbt.currentIndex===0;let qc='';if(q.type==='pg'){qc=`<div class="space-y-3 mt-4">${q.options.map((opt,idx)=>{const c=q.answer===opt?'checked':'',b=q.answer===opt?'bg-blue-50 border-blue-500':'bg-white border-slate-200 hover:bg-slate-50';return`<label class="flex items-center p-3 border rounded-lg cursor-pointer transition ${b}"><input type="radio" name="pg-answer" value="${opt}" class="w-4 h-4 text-blue-600 focus:ring-blue-500" ${c} onchange="saveAnswer('${opt}')"><span class="ml-3 text-slate-700 font-medium">${String.fromCharCode(65+idx)}. ${opt}</span></label>`}).join('')}</div>`}else if(q.type==='essay'){qc=`<div class="mt-4"><textarea id="essay-answer" rows="5" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ketik jawaban Anda di sini..." onblur="saveAnswer(this.value)">${q.answer||''}</textarea><p class="text-xs text-slate-400 mt-2"><i class="fas fa-save"></i> Jawaban tersimpan otomatis saat Anda pindah soal.</p></div>`}return`<div class="flex flex-col h-full bg-slate-50"><header class="bg-white border-b px-4 py-3 flex justify-between items-center shadow-sm sticky top-0 z-20"><div><h1 class="font-bold text-slate-800 text-sm md:text-base truncate max-w-[150px] md:max-w-xs">Matematika & Umum</h1><p class="text-xs text-slate-500">${state.user.name}</p></div><div class="flex items-center gap-3"><div class="bg-slate-800 text-white px-3 py-1.5 rounded-lg flex items-center gap-2 font-mono text-sm shadow-inner"><i class="far fa-clock"></i><span id="timer-display">${formatTime(state.cbt.timeLeft)}</span></div><button onclick="toggleGrid()" class="md:hidden bg-slate-200 p-2 rounded-lg text-slate-600"><i class="fas fa-th"></i></button></div></header><div class="flex flex-1 overflow-hidden"><main class="flex-1 overflow-y-auto p-4 md:p-6 hide-scroll relative pb-24"><div class="max-w-3xl mx-auto bg-white p-5 md:p-8 rounded-xl shadow-sm border border-slate-100"><div class="flex justify-between items-center mb-4 border-b pb-3"><div class="flex items-center gap-3"><span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">Soal No. ${state.cbt.currentIndex+1}</span><span class="bg-amber-100 text-amber-700 px-2 py-1 rounded-md text-xs font-bold shadow-sm">Bobot Nilai: ${q.bobot||0}</span></div><span class="text-xs text-slate-400 font-medium">${q.type==='pg'?'Pilihan Ganda':'Essay'}</span></div>${q.gambar?`<div class="mb-5"><img src="${q.gambar}" alt="Gambar Soal" class="max-w-full md:max-w-md h-auto rounded-lg border border-slate-200 shadow-sm"></div>`:''}<div class="text-base md:text-lg text-slate-800 leading-relaxed font-medium">${q.text}</div>${qc}</div></main><aside id="question-grid" class="hidden md:block w-64 bg-white border-l shadow-sm overflow-y-auto fixed md:relative right-0 top-0 h-full z-30 transition-transform transform translate-x-full md:translate-x-0"><div class="p-4 flex flex-col h-full"><div class="flex justify-between items-center mb-4 md:hidden"><h3 class="font-bold">Navigasi Soal</h3><button onclick="toggleGrid()" class="text-slate-500"><i class="fas fa-times text-xl"></i></button></div><h3 class="font-bold text-slate-700 hidden md:block mb-3 border-b pb-2">Navigasi Soal</h3><div class="grid grid-cols-4 gap-2 mb-6">${state.cbt.questions.map((item,idx)=>{let b='bg-white border-slate-300 text-slate-600 hover:bg-slate-100';if(item.answer!==null&&item.answer!=='')b='bg-green-500 border-green-600 text-white shadow-sm';if(idx===state.cbt.currentIndex)b='bg-blue-600 border-blue-700 text-white ring-2 ring-blue-300';return`<button onclick="jumpToQuestion(${idx})" class="w-full aspect-square flex items-center justify-center rounded border font-medium text-sm transition ${b}">${idx+1}</button>`}).join('')}</div><div class="mt-auto pt-4 border-t"><div class="flex items-center gap-2 text-xs mb-1"><span class="w-3 h-3 bg-green-500 rounded-sm"></span> Sudah Dijawab</div><div class="flex items-center gap-2 text-xs"><span class="w-3 h-3 border border-slate-300 rounded-sm"></span> Belum Dijawab</div></div></div></aside></div><footer class="bg-white border-t p-3 md:p-4 flex justify-between items-center fixed bottom-0 w-full md:w-[calc(100%-16rem)] z-20"><button onclick="prevQuestion()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50 font-medium transition flex items-center gap-2 ${isFirst?'opacity-50 cursor-not-allowed':''}" ${isFirst?'disabled':''}><i class="fas fa-chevron-left"></i> <span class="hidden sm:inline">Sebelumnya</span></button>${isLast?`<button onclick="confirmSubmit()" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow transition flex items-center gap-2"><i class="fas fa-check-circle"></i> Selesai</button>`:`<button onclick="nextQuestion()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow transition flex items-center gap-2"><span class="hidden sm:inline">Selanjutnya</span> <i class="fas fa-chevron-right"></i></button>`}</footer><div id="grid-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden" onclick="toggleGrid()"></div></div>`}
function attachCBTListeners(){window.onbeforeunload=()=>state.view==='cbt-exam'?"Ujian sedang berlangsung, yakin ingin keluar?":null}
function saveAnswer(v){state.cbt.questions[state.cbt.currentIndex].answer=v;render();showToast('Jawaban tersimpan otomatis','success')}
function nextQuestion(){if(state.cbt.currentIndex<state.cbt.questions.length-1){state.cbt.currentIndex++;render()}}
function prevQuestion(){if(state.cbt.currentIndex>0){state.cbt.currentIndex--;render()}}
function jumpToQuestion(idx){state.cbt.currentIndex=idx;render();const g=document.getElementById('question-grid');if(!g.classList.contains('translate-x-full'))toggleGrid()}
function toggleGrid(){const g=document.getElementById('question-grid'),o=document.getElementById('grid-overlay');if(g.classList.contains('translate-x-full')){g.classList.remove('hidden');setTimeout(()=>{g.classList.remove('translate-x-full');o.classList.remove('hidden')},10)}else{g.classList.add('translate-x-full');o.classList.add('hidden');setTimeout(()=>g.classList.add('hidden'),300)}}
function startTimer(){clearInterval(state.cbt.timerInterval);state.cbt.timerInterval=setInterval(()=>{state.cbt.timeLeft--;const d=document.getElementById('timer-display');if(d)d.innerText=formatTime(state.cbt.timeLeft);if(state.cbt.timeLeft<=0){clearInterval(state.cbt.timerInterval);finishExam(true)}},1000)}
function confirmSubmit(){const u=state.cbt.questions.filter(q=>q.answer===null||q.answer==='').length;let m="Apakah Anda yakin ingin menyelesaikan ujian?";if(u>0)m=`Masih ada ${u} soal yang belum dijawab. Yakin ingin mengakhiri?`;showConfirmModal(m,()=>finishExam(false))}
function showConfirmModal(msg,onConfirm){const m=document.createElement('div');m.className='fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm';m.innerHTML=`<div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center"><i class="fas fa-question-circle text-4xl text-blue-500 mb-4"></i><p class="text-slate-800 font-medium mb-6">${msg}</p><div class="flex gap-3 justify-center"><button id="btn-cancel" class="px-4 py-2 rounded-lg bg-slate-200 text-slate-700 font-medium hover:bg-slate-300">Batal</button><button id="btn-ok" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700">Yakin Selesai</button></div></div>`;document.body.appendChild(m);document.getElementById('btn-cancel').onclick=()=>m.remove();document.getElementById('btn-ok').onclick=()=>{m.remove();onConfirm()}}
function showDeleteConfirmModal(msg,onConfirm){const m=document.createElement('div');m.className='fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-300';m.innerHTML=`<div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center transform transition-all scale-100"><div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4"><i class="fas fa-exclamation-triangle"></i></div><h3 class="text-lg font-bold text-slate-800 mb-2">Konfirmasi Hapus</h3><p class="text-slate-600 text-sm mb-6">${msg}</p><div class="flex gap-3 justify-center"><button id="btn-cancel-del" class="flex-1 px-4 py-2 rounded-lg bg-slate-200 text-slate-700 font-medium hover:bg-slate-300 transition">Batal</button><button id="btn-ok-del" class="flex-1 px-4 py-2 rounded-lg bg-red-600 text-white font-medium hover:bg-red-700 transition shadow-md shadow-red-500/30">Ya, Hapus</button></div></div>`;document.body.appendChild(m);document.getElementById('btn-cancel-del').onclick=()=>m.remove();document.getElementById('btn-ok-del').onclick=()=>{m.remove();onConfirm()}}
async function finishExam(isT){window.onbeforeunload=null;clearInterval(state.cbt.timerInterval);showToast('Mengirim jawaban...','info');try{if(APPS_SCRIPT_URL!=='GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT_ANDA'){let s=0;state.cbt.questions.forEach(q=>{if(q.type==='pg'&&q.answer)s+=20});await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({nis:state.user.name,namaSiswa:state.user.name,token:state.examToken,skorPG:s,skorEssay:0})})}if(isT)showToast('Waktu habis! Jawaban otomatis dikirim.','info');else showToast('Ujian selesai. Jawaban berhasil dikirim.','success');state.view='cbt-result';render()}catch(e){showToast('Terjadi kesalahan saat mengirim jawaban.','error')}}

een items-center"><div class="font-bold">Admin CBT</div><button onclick="logout()" class="text-red-400"><i class="fas fa-sign-out-alt"></i></button></header><div class="md:hidden flex overflow-x-auto bg-white border-b hide-scroll">${tabs.map(t=>`<button onclick="switchAdminTab('${t.id}')" class="flex-none px-4 py-3 text-sm font-medium border-b-2 ${adminActiveTab===t.id?'border-blue-600 text-blue-600':'border-transparent text-slate-500'}">${t.l}</button>`).join('')}</div><main class="flex-1 overflow-y-auto p-4 md:p-8">${c}</main></div></div>`}
async function switchAdminTab(id){adminActiveTab=id;state.adminSetup.isLoading=true;render();if(id==='data-guru')await loadDataGuruFromDB();else if(id==='data-siswa')await loadDataSiswaFromDB();state.adminSetup.isLoading=false;render()}
async function loadDataGuruFromDB(){try{const{data,error}=await supabaseClient.from('guru').select('*').order('id',{ascending:true});if(error)throw error;state.adminSetup.dataGuru=data||[]}catch(e){showToast('Gagal memuat data guru: '+e.message,'error')}}

function openModalSiswa(){const m=document.createElement('div');m.id='tambah-siswa-modal';m.className='fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm';m.innerHTML=`<div class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full max-h-[90vh] overflow-y-auto"><div class="flex justify-between items-center mb-4 border-b pb-3"><h3 class="text-xl font-bold">Tambah Profil Siswa</h3><button onclick="closeModalSiswa()"><i class="fas fa-times text-xl"></i></button></div><form onsubmit="saveSiswa(event)" class="space-y-4 text-left"><div><label class="block text-sm mb-1">NIS *</label><input type="text" id="input-nis-siswa" required class="w-full px-4 py-2 border rounded-lg"></div><div><label class="block text-sm mb-1">Nama *</label><input type="text" id="input-nama-siswa" required class="w-full px-4 py-2 border rounded-lg"></div><div><label class="block text-sm mb-1">Kelas *</label><select id="input-kelas-siswa" required class="w-full px-4 py-2 border rounded-lg"><option value="">-- Pilih --</option>${state.kelas.map(k=>`<option value="${k}">${k}</option>`).join('')}</select></div><div class="pt-4 flex justify-end gap-3 border-t mt-4"><button type="button" onclick="closeModalSiswa()" class="px-5 py-2 rounded-lg bg-slate-200">Batal</button><button type="submit" id="btn-simpan-siswa" class="px-5 py-2 rounded-lg bg-green-600 text-white">Simpan</button></div></form></div>`;document.body.appendChild(m)}
function closeModalSiswa(){const m=document.getElementById('tambah-siswa-modal');if(m)m.remove()}
async function saveSiswa(e){e.preventDefault();const btn=document.getElementById('btn-simpan-siswa');btn.disabled=true;btn.innerHTML='Memproses...';const n=document.getElementById('input-nis-siswa').value,nm=document.getElementById('input-nama-siswa').value,k=document.getElementById('input-kelas-siswa').value;try{const{error}=await supabaseClient.from('siswa').insert([{nis:n,nama_lengkap:nm,kelas:k}]);if(error)throw error;showToast('Siswa disimpan.','success');closeModalSiswa();state.adminSetup.isLoading=true;render();await loadDataSiswaFromDB();state.adminSetup.isLoading=false;render()}catch(err){showToast('Gagal menyimpan: '+(err.message||'Cek database'),'error')}finally{if(btn){btn.disabled=false;btn.innerHTML='Simpan'}}}

function closeModalGuru(){const m=document.getElementById('tambah-guru-modal');if(m)m.remove()}
async function saveGuru(e){e.preventDefault();const sM=Array.from(document.querySelectorAll('input[name="cb-mapel"]:checked')).map(c=>c.value),sK=Array.from(document.querySelectorAll('input[name="cb-kelas"]:checked')).map(c=>c.value);if(!sM.length||!sK.length)return showToast('Pilih min 1 Mapel & 1 Kelas!','error');const btn=document.getElementById('btn-simpan-guru');btn.disabled=true;btn.innerHTML='Memproses...';const niy=document.getElementById('input-niy-guru').value,nama=document.getElementById('input-nama-guru').value;try{const{error}=await supabaseClient.from('guru').insert([{niy:niy,nama:nama,mapel:sM,kelas:sK}]);if(error)throw error;showToast('Guru disimpan','success');closeModalGuru();state.adminSetup.isLoading=true;render();await loadDataGuruFromDB();state.adminSetup.isLoading=false;render()}catch(err){showToast('Gagal menyimpan: '+(err.message||'Cek database'),'error')}finally{if(btn){btn.disabled=false;btn.innerHTML='Simpan'}}}
async function hapusDataGuru(id){showDeleteConfirmModal('Yakin hapus guru ini?',async()=>{try{const{error}=await supabaseClient.from('guru').delete().eq('id',id);if(error)throw error;showToast('Guru dihapus','success');state.adminSetup.isLoading=true;render();await loadDataGuruFromDB();state.adminSetup.isLoading=false;render()}catch(e){showToast('Gagal hapus: '+(e.message||'Error'),'error')}})}
async function hapusDataSiswa(id){showDeleteConfirmModal('Yakin hapus siswa ini?',async()=>{try{const{error}=await supabaseClient.from('siswa').delete().eq('id',id);if(error)throw error;showToast('Siswa dihapus','success');state.adminSetup.isLoading=true;render();await loadDataSiswaFromDB();state.adminSetup.isLoading=false;render()}catch(e){showToast('Gagal hapus: '+(e.message||'Error'),'error')}})}
function tambahMapel(){const m=document.createElement('div');m.className='fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm';m.innerHTML=`<div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full"><h3 class="font-bold mb-4">Tambah Mapel</h3><input type="text" id="in-m" class="w-full px-4 py-2 border rounded-lg mb-4"><div class="flex gap-3 justify-end"><button id="bc-m" class="px-4 py-2 bg-slate-200 rounded">Batal</button><button id="bo-m" class="px-4 py-2 bg-blue-600 text-white rounded">Simpan</button></div></div>`;document.body.appendChild(m);document.getElementById('bc-m').onclick=()=>m.remove();document.getElementById('bo-m').onclick=async()=>{const v=document.getElementById('in-m').value.trim();if(v){state.mapel.push(v);await saveMasterDataToDB('mapel',state.mapel);showToast('Ditambahkan','success');render()}m.remove()}}
function hapusMapel(idx){showDeleteConfirmModal(`Hapus mapel "${state.mapel[idx]}"?`,async()=>{state.mapel.splice(idx,1);await saveMasterDataToDB('mapel',state.mapel);render()})}
function tambahKelas(){const m=document.createElement('div');m.className='fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm';m.innerHTML=`<div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full"><h3 class="font-bold mb-4">Tambah Kelas</h3><input type="text" id="in-k" class="w-full px-4 py-2 border rounded-lg mb-4"><div class="flex gap-3 justify-end"><button id="bc-k" class="px-4 py-2 bg-slate-200 rounded">Batal</button><button id="bo-k" class="px-4 py-2 bg-blue-600 text-white rounded">Simpan</button></div></div>`;document.body.appendChild(m);document.getElementById('bc-k').onclick=()=>m.remove();document.getElementById('bo-k').onclick=async()=>{const v=document.getElementById('in-k').value.trim();if(v){state.kelas.push(v);await saveMasterDataToDB('kelas',state.kelas);showToast('Ditambahkan','success');render()}m.remove()}}
function hapusKelas(idx){showDeleteConfirmModal(`Hapus kelas "${state.kelas[idx]}"?`,async()=>{state.kelas.splice(idx,1);await saveMasterDataToDB('kelas',state.kelas);render()})}
function updateGuruSetup(k,v){if(['bobotPG','bobotEssay','targetPG','targetEssay'].includes(k))state.guruSetup[k]=parseInt(v)||0;else state.guruSetup[k]=v;if(state.guruSetup.mapel&&state.guruSetup.kelas&&state.guruSetup.bankSoal){const ag=state.guruSetup.bankSoal.find(g=>g.mapel===state.guruSetup.mapel&&g.kelas===state.guruSetup.kelas);state.guruSetup.daftarSoal=ag?ag.soalList:[];updateProgressUI()}}
async function loadDaftarSoal(){try{const t=document.getElementById('table-body-bank-soal');if(t)t.innerHTML='<tr><td colspan="5" class="text-center p-4">Memuat...</td></tr>';const{data,error}=await supabaseClient.from('soal').select('*').order('mapel',{ascending:true});if(error)throw error;const grp={};(data||[]).forEach(q=>{const k=`${q.mapel}_${q.kelas}`;if(!grp[k])grp[k]={mapel:q.mapel,kelas:q.kelas,pg:0,essay:0,soalList:[]};if(q.jenis==='pg')grp[k].pg++;if(q.jenis==='essay')grp[k].essay++;grp[k].soalList.push(q)});state.guruSetup.bankSoal=Object.values(grp);if(state.guruSetup.mapel&&state.guruSetup.kelas){const ag=state.guruSetup.bankSoal.find(g=>g.mapel===state.guruSetup.mapel&&g.kelas===state.guruSetup.kelas);state.guruSetup.daftarSoal=ag?ag.soalList:[];updateProgressUI()}else{state.guruSetup.daftarSoal=[]}renderTableBankSoal()}catch(e){showToast('Gagal memuat bank soal: '+e.message,'error')}}
function renderTableBankSoal(){const t=document.getElementById('table-body-bank-soal');if(!t)return;if(!state.guruSetup.bankSoal||state.guruSetup.bankSoal.length===0)return t.innerHTML='<tr><td colspan="5" class="text-center p-4">Kosong.</td></tr>';t.innerHTML=state.guruSetup.bankSoal.map((b,idx)=>`<tr class="border-b"><td class="p-3">${b.mapel}</td><td class="p-3">${b.kelas}</td><td class="p-3 text-center">${b.pg}</td><td class="p-3 text-center">${b.essay}</td><td class="p-3 text-center"><button onclick="lihatDetailBankSoal(${idx})" class="text-blue-500 mr-1"><i class="fas fa-eye"></i> Detail</button><button onclick="hapusBankSoal(${idx})" class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>`).join('')}
function lihatDetailBankSoal(idx){const g=state.guruSetup.bankSoal[idx];if(!g)return;const m=document.createElement('div');m.id='detail-bank-soal-modal';m.className='fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm';let c=g.soalList.map((s,i)=>`<tr class="border-b"><td class="p-3">${i+1}</td><td class="p-3"><span class="px-2 py-1 bg-slate-100 rounded text-xs">${s.jenis}</span></td><td class="p-3 truncate max-w-xs">${s.pertanyaan}</td><td class="p-3">${s.kunci_jawaban||'-'}</td><td class="p-3"><button onclick="editSoal(${s.id})" class="text-blue-500 mr-2"><i class="fas fa-edit"></i></button><button onclick="hapusSoal(${s.id})" class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>`).join('');if(!c)c='<tr><td colspan="5" class="text-center p-4">Kosong</td></tr>';m.innerHTML=`<div class="bg-white rounded-xl shadow-2xl p-6 max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col"><div class="flex justify-between border-b pb-3 mb-4"><h3 class="font-bold">Detail: ${g.mapel} - ${g.kelas}</h3><button onclick="closeDetailBankSoalModal()"><i class="fas fa-times"></i></button></div><div class="overflow-y-auto flex-1"><table class="w-full text-left text-sm"><thead class="bg-slate-100"><tr><th class="p-3">No</th><th class="p-3">Jenis</th><th class="p-3">Pertanyaan</th><th class="p-3">Kunci</th><th class="p-3">Aksi</th></tr></thead><tbody>${c}</tbody></table></div><div class="pt-4 mt-4 text-right border-t"><button onclick="closeDetailBankSoalModal()" class="px-5 py-2 bg-slate-200 rounded">Tutup</button></div></div>`;document.body.appendChild(m);if(window.renderMathInElement)setTimeout(()=>renderMathInElement(m,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}]}),100)}
function closeDetailBankSoalModal(){const m=document.getElementById('detail-bank-soal-modal');if(m)m.remove()}
async function hapusSoal(id){showDeleteConfirmModal('Yakin hapus soal ini?',async()=>{try{const{error}=await supabaseClient.from('soal').delete().eq('id',id);if(error)throw error;showToast('Dihapus','success');closeDetailBankSoalModal();await loadDaftarSoal()}catch(e){showToast('Gagal hapus: '+e.message,'error')}})}
async function hapusBankSoal(idx){const g=state.guruSetup.bankSoal[idx];if(!g)return;showDeleteConfirmModal(`Hapus SELURUH soal ${g.mapel} - ${g.kelas}?`,async()=>{try{const{error}=await supabaseClient.from('soal').delete().eq('mapel',g.mapel).eq('kelas',g.kelas);if(error)throw error;showToast('Bank soal dihapus.','success');await loadDaftarSoal()}catch(e){showToast('Gagal: '+e.message,'error')}})}
let currentEditSoalId=null;
function editSoal(id){let s=null;if(state.guruSetup.bankSoal)for(let g of state.guruSetup.bankSoal){s=g.soalList.find(x=>x.id===id);if(s)break;}if(!s)return;closeDetailBankSoalModal();currentEditSoalId=id;updateGuruSetup('mapel',s.mapel);updateGuruSetup('kelas',s.kelas);const sm=document.getElementById('setup-mapel'),sk=document.getElementById('setup-kelas');if(sm)sm.value=s.mapel;if(sk)sk.value=s.kelas;openBuatSoalModal(s)}
function cekSetupDanBukaModal(){if(!state.guruSetup.mapel||!state.guruSetup.kelas)return showToast('Pilih Mapel & Kelas!','error');currentEditSoalId=null;openBuatSoalModal()}
function downloadTemplateSoalExcel(){const ws_data=[["Jenis (pg/essay)","Pertanyaan","Opsi_A","Opsi_B","Opsi_C","Opsi_D","Kunci_Jawaban","Gambar_URL"],["pg","Berapa $1+1$?","1","2","3","4","2",""],["essay","Jelaskan!","","","","","Cahaya",""]],ws=XLSX.utils.aoa_to_sheet(ws_data);ws['!cols']=[{wch:18},{wch:50},{wch:15},{wch:15},{wch:15},{wch:15},{wch:20},{wch:30}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Template");XLSX.writeFile(wb,"Template_CBT.xlsx")}
function importSoalExcel(e){if(!state.guruSetup.mapel||!state.guruSetup.kelas){showToast('Pilih Mapel & Kelas!','error');e.target.value='';return}const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async function(ev){try{const wb=XLSX.read(ev.target.result,{type:'binary'}),json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);if(!json.length)return showToast('Kosong','error');const fd=json.map(r=>{const j=(r['Jenis (pg/essay)']||'').toLowerCase().trim();let o=null;if(j==='pg')o=[String(r.Opsi_A||''),String(r.Opsi_B||''),String(r.Opsi_C||''),String(r.Opsi_D||'')];return{mapel:state.guruSetup.mapel,kelas:state.guruSetup.kelas,bobot:j==='pg'?state.guruSetup.bobotPG:state.guruSetup.bobotEssay,jenis:j,pertanyaan:String(r.Pertanyaan||''),opsi_jawaban:o,kunci_jawaban:String(r.Kunci_Jawaban||''),gambar_url:r.Gambar_URL||null}});const{error}=await supabaseClient.from('soal').insert(fd);if(error)throw error;showToast('Import sukses','success');loadDaftarSoal()}catch(err){showToast('Error import: '+(err.message||'Unknown'),'error')}};r.readAsBinaryString(f);e.target.value=''}
function openBuatSoalModal(ed=null){const m=document.createElement('div');m.id='buat-soal-modal';m.className='fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm';const cPG=state.guruSetup.daftarSoal.filter(s=>s.jenis==='pg').length,cE=state.guruSetup.daftarSoal.filter(s=>s.jenis==='essay').length;m.innerHTML=`<div class="bg-white rounded-xl shadow-2xl p-6 max-w-3xl w-full max-h-[90vh] overflow-y-auto"><div class="flex justify-between border-b pb-3 mb-4"><h3 class="font-bold">${ed?'Edit':'Buat'} Soal</h3><button onclick="closeBuatSoalModal()"><i class="fas fa-times"></i></button></div><div class="mb-4 p-3 bg-blue-50 text-blue-800 rounded-lg text-sm flex justify-between"><div><strong>${state.guruSetup.mapel}</strong> (${state.guruSetup.kelas})</div><div class="text-right">PG: <span id="prog-pg">${cPG}</span>/${state.guruSetup.targetPG} | Essay: <span id="prog-es">${cE}</span>/${state.guruSetup.targetEssay}</div></div><form onsubmit="saveSoal(event)"><select id="input-jenis" class="w-full p-2 border rounded mb-4" onchange="toggleOpsiJawaban()" ${ed?'disabled':''}><option value="pg" ${ed&&ed.jenis==='pg'?'selected':''}>Pilihan Ganda</option><option value="essay" ${ed&&ed.jenis==='essay'?'selected':''}>Essay</option></select><input type="file" id="input-gambar" accept="image/*" class="w-full p-2 border rounded mb-4"><textarea id="input-pertanyaan" required rows="3" class="w-full p-2 border rounded mb-4" placeholder="Pertanyaan...">${ed?ed.pertanyaan:''}</textarea><div id="container-opsi" class="space-y-2 mb-4"><div class="flex gap-2"><input type="radio" name="kunci_pg" value="0" id="radio-a" required><input type="text" id="opsi-a" class="w-full p-2 border rounded" placeholder="A" required value="${ed&&ed.jenis==='pg'?ed.opsi_jawaban[0]:''}"></div><div class="flex gap-2"><input type="radio" name="kunci_pg" value="1" id="radio-b" required><input type="text" id="opsi-b" class="w-full p-2 border rounded" placeholder="B" required value="${ed&&ed.jenis==='pg'?ed.opsi_jawaban[1]:''}"></div><div class="flex gap-2"><input type="radio" name="kunci_pg" value="2" id="radio-c" required><input type="text" id="opsi-c" class="w-full p-2 border rounded" placeholder="C" required value="${ed&&ed.jenis==='pg'?ed.opsi_jawaban[2]:''}"></div><div class="flex gap-2"><input type="radio" name="kunci_pg" value="3" id="radio-d" required><input type="text" id="opsi-d" class="w-full p-2 border rounded" placeholder="D" required value="${ed&&ed.jenis==='pg'?ed.opsi_jawaban[3]:''}"></div></div><div id="container-kunci-essay" class="hidden mb-4"><textarea id="input-kunci-essay" rows="2" class="w-full p-2 border rounded" placeholder="Kata Kunci">${ed&&ed.jenis==='essay'?ed.kunci_jawaban:''}</textarea></div><div class="flex justify-end gap-2 pt-4 border-t"><button type="button" onclick="closeBuatSoalModal()" class="px-4 py-2 bg-slate-200 rounded">Tutup</button><button type="submit" id="btn-simpan-soal" class="px-4 py-2 bg-blue-600 text-white rounded">${ed?'Simpan Perubahan':'Simpan & Lanjut'}</button></div></form></div>`;document.body.appendChild(m);toggleOpsiJawaban();if(ed&&ed.jenis==='pg'&&ed.kunci_jawaban){const i=ed.opsi_jawaban.indexOf(ed.kunci_jawaban);if(i>=0)document.getElementById(`radio-${['a','b','c','d'][i]}`).checked=true}}
function updateProgressUI(){const pP=document.getElementById('prog-pg'),pE=document.getElementById('prog-es');if(!pP||!pE)return;const cP=state.guruSetup.daftarSoal.filter(s=>s.jenis==='pg').length,cE=state.guruSetup.daftarSoal.filter(s=>s.jenis==='essay').length;pP.innerText=cP;pE.innerText=cE;if(cP>=state.guruSetup.targetPG)pP.classList.add('text-green-600');if(cE>=state.guruSetup.targetEssay)pE.classList.add('text-green-600')}
function closeBuatSoalModal(){const m=document.getElementById('buat-soal-modal');if(m)m.remove();currentEditSoalId=null}
function toggleOpsiJawaban(){const j=document.getElementById('input-jenis').value,cO=document.getElementById('container-opsi'),cK=document.getElementById('container-kunci-essay');if(j==='pg'){cO.classList.remove('hidden');cK.classList.add('hidden');cO.querySelectorAll('input').forEach(i=>i.required=true)}else{cO.classList.add('hidden');cK.classList.remove('hidden');cO.querySelectorAll('input').forEach(i=>i.required=false)}}
async function saveSoal(e){e.preventDefault();const b=document.getElementById('btn-simpan-soal');b.disabled=true;b.innerHTML='Menyimpan...';const j=document.getElementById('input-jenis').value,p=document.getElementById('input-pertanyaan').value,f=document.getElementById('input-gambar');let gU=null;if(f.files&&f.files[0])gU=URL.createObjectURL(f.files[0]);else if(currentEditSoalId){const os=state.guruSetup.daftarSoal.find(s=>s.id===currentEditSoalId);gU=os?os.gambar_url:null}let o=null,k=null;if(j==='pg'){o=[document.getElementById('opsi-a').value,document.getElementById('opsi-b').value,document.getElementById('opsi-c').value,document.getElementById('opsi-d').value];const sr=document.querySelector('input[name="kunci_pg"]:checked');if(sr)k=o[parseInt(sr.value)]}else k=document.getElementById('input-kunci-essay').value;const py={mapel:state.guruSetup.mapel,kelas:state.guruSetup.kelas,bobot:j==='pg'?state.guruSetup.bobotPG:state.guruSetup.bobotEssay,jenis:j,pertanyaan:p,opsi_jawaban:o,kunci_jawaban:k,gambar_url:gU};try{if(currentEditSoalId){const{error}=await supabaseClient.from('soal').update(py).eq('id',currentEditSoalId);if(error)throw error;showToast('Disimpan!','success');closeBuatSoalModal()}else{const{error}=await supabaseClient.from('soal').insert([py]);if(error)throw error;showToast('Disimpan. Lanjut soal.','success');document.getElementById('input-pertanyaan').value='';document.getElementById('input-gambar').value='';if(j==='pg'){['a','b','c','d'].forEach(x=>document.getElementById(`opsi-${x}`).value='');document.querySelectorAll('input[name="kunci_pg"]').forEach(r=>r.checked=false)}else document.getElementById('input-kunci-essay').value=''}await loadDaftarSoal()}catch(er){showToast('Gagal: '+(er.message||'Unknown'),'error')}finally{if(b){b.disabled=false;b.innerHTML=currentEditSoalId?'Simpan Perubahan':'Simpan & Lanjut'}}}
async function logout(){await supabaseClient.auth.signOut();state.view='login';state.user=null;state.role=null;clearInterval(state.cbt.timerInterval);render();showToast('Anda berhasil keluar.','info')}
window.onload=render;
</script>
</body>
